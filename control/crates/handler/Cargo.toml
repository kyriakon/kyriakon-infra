[package]
name = "kyriakon-control-handler"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "kyriakon-control"
path = "src/main.rs"

[features]
# Exposes the form decoder to `control/fuzz`; nothing in the service turns it on.
fuzz = []

[dependencies]
askama.workspace = true
kyriakon-control-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
ulid.workspace = true

[dev-dependencies]
# The FastCGI fixtures the responder's tests send, built in core so the wire has
# one description.
kyriakon-control-core = { path = "../core", features = ["test-fixtures"] }
