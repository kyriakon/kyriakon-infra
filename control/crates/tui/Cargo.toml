[package]
name = "kyriakon-control-tui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "kyriakon-control-tui"
path = "src/main.rs"

[dependencies]
kyriakon-control-core = { path = "../core" }
libc.workspace = true

[dev-dependencies]
# The flow tests check a real key; a service build must not.
kyriakon-control-core = { path = "../core", features = ["test-fixtures"] }
