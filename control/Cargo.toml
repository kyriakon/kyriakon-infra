[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/handler",
    "crates/drain",
    "crates/tui",
    "crates/admin",
    "crates/tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
askama = "0.14"
hmac = "0.12"
sha2 = "0.10"
bcrypt = "0.15"
sha1 = "0.10"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["std", "formatting", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs", "io-util", "process", "sync", "time"] }
toml = "0.9"
ulid = "1"
keygen-spike = { path = "../docs/planning/prototypes/keygen-spike", default-features = false }
