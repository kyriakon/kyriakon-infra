# The control plane's parsers under libFuzzer: the FastCGI reader and the form
# decoder behind the public signup page, and the member path resolver. Not part
# of the service build: `cargo-fuzz` builds on nightly, which is why this is a
# crate of its own.
#
#   cargo +nightly fuzz run request
#   cargo +nightly fuzz run form
#   cargo +nightly fuzz run resolve
#
# Seeds are committed in `corpus/`, except the FastCGI wire seeds: those are
# bytes and the repository tracks no binaries, so docs/runbook.md prints the
# command that writes one. A crash lands in `artifacts/<target>/` and is turned
# into a test in the crate it came from.
[package]
name = "kyriakon-control-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tokio = { version = "1", features = ["rt", "io-util"] }

[dependencies.kyriakon-control-handler]
path = "../crates/handler"
features = ["fuzz"]

[dependencies.kyriakon-control-static]
path = "../crates/static"

[[bin]]
name = "request"
path = "fuzz_targets/request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "form"
path = "fuzz_targets/form.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resolve"
path = "fuzz_targets/resolve.rs"
test = false
doc = false
bench = false

# Detached from the workspace above: this crate needs nightly, and the control
# job in checks.yml builds every workspace member on stable.
[workspace]