[package]
name = "kyriakon-onboard"
version = "0.1.0"
edition = "2021"
description = "Onboarding handler and root drain: the handler renders the applicant page and writes one JSON intent per submission; the drain applies them"
publish = false

[dependencies]
# The framework the spec fixes for the service.
askama = "0.14"
# axum over tokio: the routes, the extractors, and the loopback listener.
axum = { version = "0.8", features = ["form"] }
# sha2 and hmac are the one pair the drain adds. The review email's three links
# and the one-time password link are HMAC-SHA256 over their payload, keyed from
# the root-only approval key file: the same process signs and verifies, so a
# signature would buy a keypair nothing here needs. Nothing else in the crate
# hashes, which is why the fingerprints stay the browser's own numbers.
hmac = "0.12"
sha2 = "0.10"
# libc is for the two things std does not expose: geteuid, so the signing-key
# check only demands a root-owned file when the drain is actually root, and
# O_NOFOLLOW, so a temporary file the unprivileged half could plant a symlink at
# is opened with the protections the store's mixed ownership needs.
libc = "0.2"
# serde deserializes the form and serializes the record; axum's Form and
# serde_json both build on it.
serde = { version = "1", features = ["derive"] }
# The intent and the application record are JSON, the shape the drain reads.
serde_json = "1"
# filed_at, RFC 3339 in UTC, and reading back the decision time the drain
# writes. One crate, so the formatting and parsing of a store timestamp move
# together.
time = { version = "0.3", features = ["std", "formatting", "parsing"] }
# The drain runs the enqueuer and the provisioning scripts, which is what
# "process" is for; the rest is the handler's own runtime.
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs", "io-util", "process"] }
# The config is TOML, the format the spec names for the service's own file.
toml = "0.9"
# The intent id is a ULID, the format the drain parses. The status token is not a
# ULID: it is 128 bits of Crockford encoded by hand in store.rs, because a ULID
# spends 48 of its bits on a timestamp and a bearer capability must not.
ulid = "1"
