<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Kyriakon{% endblock %}</title>
{#
  The stylesheet is inline and there is no script of any kind: the same rule the
  real pages carry, no external requests. The form works without script, and the
  community block is served already open or already absent.
#}
<style>
  :root { --ink:#1b1b1b; --dim:#5d5d5d; --line:#d8d4cc; --bg:#fbfaf7; --accent:#7a4b1e; --warn:#8a3b12; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",serif; color:var(--ink); background:var(--bg); }
  main { padding:34px 22px 80px; max-width:820px; margin:0 auto; }
  h2 { font-size:26px; margin:0 0 6px; }
  h3 { font-size:17px; margin:26px 0 6px; }
  h4 { font-size:15px; margin:20px 0 4px; }
  h3:first-child, h4:first-child { margin-top:0; }
  .lede { color:var(--dim); margin:0 0 20px; }
  .card { border:1px solid var(--line); background:#fff; border-radius:6px; padding:16px 18px; margin:14px 0; }
  label { display:block; font-weight:600; font-size:14.5px; margin:16px 0 4px; }
  label .opt { font-weight:400; color:var(--dim); }
  input[type=text], textarea, select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:4px; font:inherit; background:#fff; }
  input[type=checkbox] { margin:0 6px 0 0; }
  textarea { min-height:64px; }
  .hint { font-size:13px; color:var(--dim); margin:4px 0 0; }
  .btn { display:inline-block; background:var(--accent); color:#fff; padding:10px 18px; border-radius:5px; border:0; font:inherit; cursor:pointer; margin:18px 12px 0 0; }
  .tag { display:inline-block; font-size:12px; border:1px solid var(--line); border-radius:99px; padding:2px 9px; color:var(--dim); margin-left:6px; }
  .warn { border-left:3px solid var(--warn); padding:6px 0 6px 12px; margin:14px 0; font-size:14.5px; }
  .warn ul { margin:0; padding-left:20px; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13.5px; }
  fieldset.community { border:0; padding:0; margin:0; }
</style>
</head>
<body>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
