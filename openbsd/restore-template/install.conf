# Response file for the restore template's unattended OpenBSD 7.9 install.
#
# Every question below is written as 7.9's installer words it, read out of the
# release's own bsd.rd ramdisk rather than from a guide. Older write-ups, and the
# autoinstall(8) example, use different wording and would be ignored: autoinstall
# matches the question text, and an answer it cannot match falls back to the
# installer's default, which is the trap this file exists to avoid.
#
# Anything not listed here takes the installer's default, which is what pressing
# Enter would do: the only disk as the root disk, the automatic layout, all sets,
# sshd started by default, and no disk encryption.
#
# There are no secrets here. The file is in a public repository, so the root
# password is disabled rather than set, and access is by ssh key.

System hostname = kyriakon-restore-template
Password for root account = *************
Public ssh key for root account = ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFvWcMN1mB46y9E9diUw+c9S4AP0S7fYCvvwa1NyKzgj oliver@kyriakon.net
What timezone are you in = UTC
Location of sets = http
HTTP Server = cdn.openbsd.org
Encrypt the root disk with a (p)assphrase or (k)eydisk = no

# The encryption answer is explicit even though the installer's own default is
# already `no` (`ask 'Encrypt the root disk...' no` in the ramdisk). A template
# that came out encrypted would boot to a passphrase prompt in the Hetzner
# console and answer nothing on the network, and the weekly run would fail on its
# own ssh timeout every time. Verify on the finished box: `bioctl softraid0` must
# report no volume and `sysctl -n hw.disknames` must show a single disk.
#
# Not set here, and taken from the installer's defaults instead: the root disk
# (the only one), the automatic layout, and all sets.
