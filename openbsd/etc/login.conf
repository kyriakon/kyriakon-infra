# login.conf: the box's whole login class database, base entries and ours.
#
# On-box path: /etc/login.conf. Applied by hand, never by a deploy. It matters
# to sshd because the shell a forced command is run through comes from the
# account's login class, not from its password entry.
#
# This is the WHOLE file, not an addition to the base system's, and that is
# deliberate. Nothing in login.conf is additive to the shipped file: a copy
# holding only the onboard stanza would leave the box with no `default` class at
# all, and every login would lose its path and resource limits. The base entries
# below are the file the box runs, kept verbatim (its RCS revision line is the
# first line of the base section below), so a reader of this repository sees
# what the box sees. The one stanza this platform adds is marked at the end and
# is the only difference.
#
# The onboard class is what lets the onboarding TUI run without putting a
# program in a password entry. The account's shell stays /sbin/nologin, and sshd
# takes the session shell from the class instead: auth.c sets
# lc = login_getclass(pw->pw_class), and session.c's do_child() takes
# shell = login_getcapstr(lc, "shell", pw_shell, pw_shell) and execs the forced
# command through it. So the class's `shell` is what runs the TUI, while an
# interactive login as the account is still refused by nologin. Without the
# class the forced command would be exec'd through /sbin/nologin, which ignores
# -c and exits.
#
# sshd reads the built database (/etc/login.conf.db) when it exists, so run
# `doas cap_mkdb /etc/login.conf` after every edit here, including the one that
# adds the onboard class below.

# --- base system ----------------------------------------------------------
# $OpenBSD: login.conf,v 1.27 2025/07/17 14:44:42 landry Exp $

#
# Sample login.conf file.  See login.conf(5) for details.
#

#
# Standard authentication styles:
#
# passwd	Use only the local password file
# chpass	Do not authenticate, but change user's password (change
#		the YP password if the user has one, else change the
#		local password)
# lchpass	Do not login; change user's local password instead
# ldap		Use LDAP authentication
# radius	Use RADIUS authentication
# reject	Use rejected authentication
# skey		Use S/Key authentication
# activ		ActivCard X9.9 token authentication
# crypto	CRYPTOCard X9.9 token authentication
# snk		Digital Pathways SecureNet Key authentication
# token		Generic X9.9 token authentication
# yubikey	YubiKey authentication
#

# Default allowed authentication styles
auth-defaults:auth=passwd,skey:

# Default allowed authentication styles for authentication type ftp
auth-ftp-defaults:auth-ftp=passwd:

#
# The default values
# To alter the default authentication types change the line:
#	:tc=auth-defaults:\
# to read something like: (enables passwd, "myauth", and activ)
#	:auth=passwd,myauth,activ:\
# Any value changed in the daemon class should be reset in default
# class.
#
default:\
	:path=/usr/bin /bin /usr/sbin /sbin /usr/X11R6/bin /usr/local/bin /usr/local/sbin:\
	:umask=022:\
	:datasize-max=1536M:\
	:datasize-cur=1536M:\
	:maxproc-max=256:\
	:maxproc-cur=128:\
	:openfiles-max=1024:\
	:openfiles-cur=512:\
	:stacksize-cur=4M:\
	:localcipher=blowfish,a:\
	:tc=auth-defaults:\
	:tc=auth-ftp-defaults:

#
# Settings used by /etc/rc and root
# This must be set properly for daemons started as root by inetd as well.
# Be sure to reset these values to system defaults in the default class!
#
daemon:\
	:ignorenologin:\
	:datasize=4096M:\
	:maxproc=infinity:\
	:openfiles-max=1024:\
	:openfiles-cur=128:\
	:stacksize-cur=8M:\
	:tc=default:

#
# Staff have fewer restrictions and can login even when nologins are set.
#
staff:\
	:datasize-cur=1536M:\
	:datasize-max=infinity:\
	:maxproc-max=512:\
	:maxproc-cur=256:\
	:ignorenologin:\
	:requirehome@:\
	:tc=default:

#
# Authpf accounts get a special motd and shell
#
authpf:\
	:welcome=/etc/motd.authpf:\
	:shell=/usr/sbin/authpf:\
	:tc=default:

#
# Building LLVM in base requires higher limits
#
build:\
	:datasize-max=1843M:\
	:datasize-cur=1843M:\
	:tc=default:

#
# Building ports with DPB uses raised limits
#
pbuild:\
	:datasize-max=infinity:\
	:datasize-cur=12G:\
	:maxproc-max=1024:\
	:maxproc-cur=512:\
	:stacksize-cur=8M:\
	:priority=5:\
	:tc=default:

#
# Override resource limits for certain daemons started by rc.d(8)
#
bgpd:\
	:datasize=16384M:\
	:openfiles=512:\
	:tc=daemon:

unbound:\
	:openfiles=512:\
	:tc=daemon:

vmd:\
	:datasize=16384M:\
	:tc=daemon:

xenodm:\
	:openfiles=512:\
	:tc=daemon:

# --- kyriakon: the onboarding TUI's session shell -------------------------
# One account, one program. The class gives sshd the shell to run the forced
# command through; the account's own password entry keeps /sbin/nologin, so
# there is no shell on the account. tc=default inherits the base resource
# limits. The `onboard` account and the sshd instance that use this class are
# provisioned by hand from their own tickets, not by anything that installs
# this file.
onboard:\
	:shell=/usr/local/sbin/kyriakon-onboard-tui:\
	:tc=default:
