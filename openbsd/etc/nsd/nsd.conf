# nsd.conf - kyriakon.net hidden primary.
#
# On-box path: /var/nsd/etc/nsd.conf. nsd chroots to /var/nsd and drops to the
# _nsd user, so the paths below are the man-page defaults inside that chroot.
# Deploy by copying this file and the zone into /var/nsd/etc/, then:
#   nsd-checkconf /var/nsd/etc/nsd.conf
#   rcctl restart nsd        # reload a zone edit with: rcctl reload nsd
#
# This box is the HIDDEN primary: it serves the zone and answers AXFR/NOTIFY to
# Hurricane Electric, but is absent from the zone's public NS records (those
# point only at ns1-ns5.he.net). HE is the public secondary.

server:
	server-count: 1
	username: _nsd
	# Bind the box's two public addresses instead of every interface. nsd binds
	# its UDP sockets without SO_REUSEADDR, and unbound, this box's resolver
	# installed for the blocklist lookups, holds 127.0.0.1:53 and ::1:53, so a
	# wildcard bind loses to it and nsd does not start at all:
	#   error: can't bind udp socket ::@53: Address already in use
	#   error: server initialization failed, nsd could not be started
	# which rcctl reports only as nsd(failed). Naming the addresses also keeps
	# nsd off loopback, where the resolver belongs. Verified 2026-09-28: an
	# unprivileged wildcard UDP bind fails against a loopback listener that set
	# SO_REUSEADDR, and succeeds when bound to a specific address.
	#
	# deploy-nsd.sh substitutes the RFC 5737/3849 documentation addresses below
	# with the same two it substitutes into the zones (terraform output
	# ipv4_address / ipv6_address).
	ip-address: 203.0.113.10
	ip-address: 2001:db8::10
	zonelistfile: /var/nsd/db/zone.list
	logfile: /var/log/nsd.log
	xfrdfile: /var/nsd/run/xfrd.state

# OpenBSD's /etc/rc.d/nsd runs the daemon through nsd-control(8), which reaches
# it over this socket: rc_start execs nsd, but rc_check, rc_reload and rc_stop
# all go through nsd-control. Without control-enable (the upstream default is
# no) rcctl check reports nsd(failed) even while the daemon is serving, and
# rcctl reload/stop cannot reach it. Local-only socket, outside the chroot, as
# in OpenBSD's shipped /etc/nsd.conf.
remote-control:
	control-enable: yes
	control-interface: /var/run/nsd.sock

# TSIG key shared with Hurricane Electric's secondary. HE signs its AXFR
# requests with this key and nsd refuses an unsigned or wrong-key request, so
# the key - not a source-IP allowlist - is what authenticates the transfer.
# HE's transfer source IPs are unpublished, which is exactly what TSIG avoids
# depending on. The secret is NOT in this repo: deploy-nsd.sh substitutes the
# real base64 value at deploy time from an argument. Key name and algorithm
# must match the HE portal's TSIG entry exactly.
key:
	name: kyriakon-he
	algorithm: hmac-sha256
	secret: "REPLACE_ME"

zone:
	name: kyriakon.net
	zonefile: /var/nsd/etc/kyriakon.net.zone
	# Any source may ask; only a request signed with kyriakon-he is served
	# (acl_key_matches() in nsd's options.c refuses a missing TSIG, a TSIG
	# error, a different key name, or the wrong algorithm), so the ACL can be
	# wide without exposing the zone.
	provide-xfr: 0.0.0.0/0 kyriakon-he
	provide-xfr: ::0/0 kyriakon-he
	# One notify target, because only one accepts it. Measured 2026-09-30 on
	# the box with `dig +opcode=notify @<addr> <zone>`: 216.218.130.2
	# (ns1.he.net) answers NOERROR, and 216.218.131.2, 216.218.132.2,
	# 216.66.1.2 and 216.66.80.18 answer REFUSED, for kyriakon.net and
	# kyriakon.com alike, whether nsd signs the notify or dig sends it plain.
	# `grep -o "REFUSED from [0-9.]*" /var/log/nsd.log | sort | uniq -c` counted
	# 55 refusals from each of the four and 5 from ns1, all of ns1's on
	# 2026-09-18 before kyriakon.com was in HE's slave panel. Every edit also
	# cost a "max notify send count reached" retry storm. All five nameservers
	# answer the same SOA serial, so the four that refuse are not stale: HE
	# moves the zone internally once ns1 has pulled it.
	#
	# Re-derive the list the same way and keep only the addresses that answer
	# NOERROR. The test has to run from this box, because HE authorises a
	# notify by source address and answers REFUSED to every address from
	# anywhere else. The original entry, 216.218.133.2, is HE's AXFR source in
	# `grep axfr /var/log/nsd.log` and never a notify target; it logged "max
	# notify send count reached ... unreachable" from 2026-09-11. The SOA
	# refresh below is the backstop when a notify is lost.
	notify: 216.218.130.2 kyriakon-he

zone:
	name: kyriakon.com
	zonefile: /var/nsd/etc/kyriakon.com.zone
	# Same TSIG key and same wide source ACL as kyriakon.net, for the reason
	# written above: the key is what authorises a transfer, so the source range
	# carries no meaning. If HE issues a separate key when the zone is added to
	# their secondary panel, this block needs its own key: stanza and the name
	# in the lines below changed to match.
	provide-xfr: 0.0.0.0/0 kyriakon-he
	provide-xfr: ::0/0 kyriakon-he
	# Same single target and the same evidence as kyriakon.net above (ns1
	# NOERROR, the other four REFUSED, for this zone too). This zone changes
	# about once a year, where the refresh timer alone would do.
	notify: 216.218.130.2 kyriakon-he
