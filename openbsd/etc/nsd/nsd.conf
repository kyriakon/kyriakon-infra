# nsd.conf - kyriakon.net hidden primary.
#
# On-box path: /var/nsd/etc/nsd.conf. nsd chroots to /var/nsd and drops to the
# _nsd user, so the paths below are the man-page defaults inside that chroot.
# Deploy by copying this file and the zone into /var/nsd/etc/, then:
#   nsd-checkconf /var/nsd/etc/nsd.conf
#   rcctl restart nsd        # or: kill -HUP $(cat /var/nsd/run/nsd.pid)
#
# This box is the HIDDEN primary: it serves the zone and answers AXFR/NOTIFY to
# Hurricane Electric, but is absent from the zone's public NS records (those
# point only at ns1-ns5.he.net). HE is the public secondary.

server:
	server-count: 1
	username: _nsd
	zonelistfile: /var/nsd/db/zone.list
	logfile: /var/log/nsd.log
	xfrdfile: /var/nsd/run/xfrd.state

zone:
	name: kyriakon.net
	zonefile: /var/nsd/etc/kyriakon.net.zone
	# HE secondary: send NOTIFY on zone change + allow AXFR. NOKEY = no TSIG -
	# HE's free service doesn't require it, so IP-ACL is the MVP floor (TSIG is
	# a later hardening step). HE's AXFR source IPs are NOT published anywhere:
	# pin them at dns.he.net signup/validation and substitute below. Never
	# 0.0.0.0/0 - that would let anyone AXFR the whole zone (leaks the DKIM
	# record and every per-user hostname pattern).
	notify: <he-transfer-ip-1> NOKEY
	notify: <he-transfer-ip-2> NOKEY
	provide-xfr: <he-transfer-ip-1> NOKEY
	provide-xfr: <he-transfer-ip-2> NOKEY
