# spamd.conf - the blacklist loader for spamd-setup(8).
#
# On-box path: /etc/mail/spamd.conf.
#
# Greylisting needs nothing from this file. It is spamd's default mode, and the
# only thing that switches it on is the pf divert-to rule. <spamd-white>, the
# table that lets a host through after it retries, is maintained by spamd itself
# from /var/db/spamd.
#
# The file has to exist anyway: /etc/rc.d/spamd runs spamd-setup(8) on every
# start, and spamd-setup reads this fixed path and aborts with `Can't find "all"
# in spamd config` when the tag is missing. A start that returns nonzero takes
# the whole deploy down, so an empty all: tag is what makes `rcctl start spamd`
# succeed.
#
# No blacklists are listed. A DNSBL would put a third party in the mail path and
# bring its own failure mode, and that is a decision to take on its own.
#
# The pf fragment, timing defaults and verification:
# docs/planning/research/spamd-greylisting.md

# The all: tag must not end in a backslash unless a continuation line follows it.
# A trailing backslash with nothing after it is an unterminated capability
# record, cgetent(3) fails to find the tag, and spamd-setup reports that with a
# stale errno from an earlier open: `Can't find "all" in spamd config: No such
# file or directory`, while the file is present and readable. Verified with a
# throwaway cgetent harness on the box; the empty tag alone is the form that
# works.
all:
