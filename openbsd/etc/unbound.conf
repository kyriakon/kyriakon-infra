# unbound.conf: the resolver, tracked here because one setting in it decides
# whether the strongest blocklist answers at all.
#
# This is the base system's /var/unbound/etc/unbound.conf, from the CVS revision
# named below, with one setting added. The tag is kept so the next OpenBSD
# revision can be diffed against this file, and the deploy validates the copy with
# unbound-checkconf before the resolver is restarted, so a bad file cannot take
# DNS down on the box it is meant to serve.
#
# It is here rather than applied by hand because this setting is the kind that gets
# lost: an edit made once on the box is invisible to the next rebuild, and its
# absence shows up days later as a monitoring alert nobody connects to it. The
# blocklist section of docs/runbook.md has the story.

# $OpenBSD: unbound.conf,v 1.21 2020/10/28 11:35:58 sthen Exp $

server:
	interface: 127.0.0.1
	#interface: 127.0.0.1@5353	# listen on alternative port
	interface: ::1
	#do-ip6: no

	# override the default "any" address to send queries; if multiple
	# addresses are available, they are used randomly to counter spoofing
	#outgoing-interface: 192.0.2.1
	#outgoing-interface: 2001:db8::53

	access-control: 0.0.0.0/0 refuse
	access-control: 127.0.0.0/8 allow
	access-control: ::0/0 refuse
	access-control: ::1 allow

	hide-identity: yes
	hide-version: yes

	# QNAME minimisation off, and the only line in this file that is ours.
	#
	# Spamhaus's DNSBL zones answer NS and SOA queries in a way that does not
	# match RFC 1034, and minimisation is what asks those questions. The effect is
	# one-sided: a lookup that ends in a record resolves, so a listing is found,
	# while a lookup that ends clean does not, so the blocklist check reports no
	# verdict from the strongest list for an address that is in fact clean.
	# Spamhaus recommends turning it off for this, and recommends it knowing the
	# cost: unbound has no per-zone form, so every query from this box stops using
	# it, and their argument is that a blocklist lookup sends all its queries to one
	# nameserver, so there is no privacy there to lose.
	#
	# spamhaus.org/resource-hub/dnsbl/qname-minimization-and-spamhaus-dnsbls/
	# docs.spamhaus.com/datasets/docs/source/40-real-world-usage/Dns/040-Unbound.html
	qname-minimisation: no

	# Perform DNSSEC validation.
	#
	auto-trust-anchor-file: "/var/unbound/db/root.key"
	val-log-level: 2

	# Synthesize NXDOMAINs from DNSSEC NSEC chains.
	# https://tools.ietf.org/html/rfc8198
	#
	aggressive-nsec: yes

	# Serve zones authoritatively from Unbound to resolver clients.
	# Not for external service.
	#
	#local-zone: "local." static
	#local-data: "mycomputer.local. IN A 192.0.2.51"
	#local-zone: "2.0.192.in-addr.arpa." static
	#local-data-ptr: "192.0.2.51 mycomputer.local"

	# Use TCP for "forward-zone" requests. Useful if you are making
	# DNS requests over an SSH port forwarding.
	#
	#tcp-upstream: yes

	# CA Certificates used for forward-tls-upstream (RFC7858) hostname
	# verification.  Since it's outside the chroot it is only loaded at
	# startup and thus cannot be changed via a reload.
	#tls-cert-bundle: "/etc/ssl/cert.pem"

remote-control:
	control-enable: yes
	control-interface: /var/run/unbound.sock

# Use an upstream forwarder (recursive resolver) for some or all zones.
#
#forward-zone:
#	name: "."				# use for ALL queries
#	forward-addr: 192.0.2.53		# example address only
#	forward-first: yes			# try direct if forwarder fails

# Use an upstream DNS-over-TLS forwarder and do not fall back to cleartext
# if that fails.
#forward-zone:
#	name: "."
#	forward-tls-upstream: yes		# use DNS-over-TLS forwarder
#	forward-first: no			# do NOT send direct
#	# the hostname after "#" is not a comment, it is used for TLS checks:
#	forward-addr: 192.0.2.53@853#resolver.hostname.example
