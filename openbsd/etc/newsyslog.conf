# newsyslog.conf — kyriakon.net log-retention bound.
#
# On-box path: /etc/newsyslog.conf. newsyslog(8) reads this on its hourly run
# (root crontab) and rotates/truncates each `logfile_name` line below. It is
# the single place that *enforces* the retention window the threat model
# claims — without it, "/var/log/* grows unbounded and the ~7-day promise is
# prose, not config" (threat-model.md "Correspondence metadata").
#
# Every entry below is a log that carries correspondence/user metadata and
# must be bounded. `count 7` = at most 7 archived copies plus the live file,
# so each line expires roughly one week after it is written. The number is
# deliberate, not arbitrary: it is the shortest window that still lets
# scripts/abuse-monitor.sh catch a slow-burn compromise (a low-and-slow relay,
# a credential-stuffing ramp), while discarding the raw per-user detail (IPs,
# timestamps) as soon as that window closes.
#
# The one thing this does NOT bound is correspondence metadata itself (who
# emailed whom, at what size): that is a routing necessity and cannot be
# hidden — see threat-model.md. What we bound is how long the *record* of it
# persists on disk.
#
# NOT here, deliberately: scripts/backup.sh and scripts/restore-test.sh emit
# transient job output with no per-user correspondence metadata, so there is
# nothing worth archiving. The Phase 3 onboarding service (docs/planning/specs
# /phase-1-foundations.md) will emit its own log; add its entry here the day
# it lands, already bounded, rather than inventing a path for a service that
# does not exist yet.

# --- Mail: smtpd (envelope, mta relay) + Dovecot (PAM auth) -------------
# The highest-privacy log here: it carries sender/recipient pairs, timestamps,
# message sizes, and auth results. Bound hard.
/var/log/maillog	root:wheel	600	7	*	$D0	J

# --- Auth: sshd login failures (and any console auth) -------------------
# Per-account, per-source-IP auth attempts. The raw IP is the exposure; it is
# discarded at rotation, and scripts/abuse-monitor.sh keeps only the *count*,
# never a per-IP identifier (see CONTEXT.md "log minimization").
/var/log/authlog	root:wheel	600	7	*	$D0	J

# --- DNS: nsd zone-transfer/query logging -------------------------------
# Lower sensitivity (DNS queries are not mail correspondence), but still
# bounded for consistency: nsd.conf points its logfile here.
/var/log/nsd.log	root:wheel	600	7	*	$D0	J
