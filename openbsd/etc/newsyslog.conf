# newsyslog.conf — the box's whole log-rotation and retention config.
#
# On-box path: /etc/newsyslog.conf, installed by scripts/deploy-mail.sh.
# newsyslog(8) reads this on its hourly run (root crontab) and rotates or
# truncates each line's log file. It is the single place that *enforces* the
# retention window the threat model claims — without it, /var/log/* grows
# unbounded and the ~7-day promise is prose, not config (threat-model.md
# "Correspondence metadata").
#
# This is the WHOLE file, not an addition to the base system's, and that is
# deliberate. newsyslog has no `include`, and the base file carries entries for
# logs that are not ours (/var/log/messages, /var/cron/log, wtmp, pflog and the
# rest), so a file holding only our own lines would silently stop rotating those
# and they would grow until the disk did. Every entry the box needs is here.
# The kyriakon lines are marked below; the rest are the base system's, kept
# verbatim so a reader of this repository sees the file the box runs.
#
# Flags are OpenBSD's (newsyslog.conf(5)): `Z` compresses the archive with
# gzip(1), `B` marks a binary file whose turnover message must not be inserted,
# `M` marks a monitored log. There is no `J` flag on OpenBSD; that letter is
# FreeBSD's bzip2, and newsyslog ignores a flag it does not know, so a `J` here
# would read as "compress" to a person and do nothing at all to the archive.
#
# `count 7` means at most seven archives beside the live file, so a daily entry
# expires its record about a week after it is written. The number is deliberate:
# the shortest window that still lets scripts/abuse-monitor.sh catch a slow-burn
# compromise (a low-and-slow relay, a credential-stuffing ramp), while
# discarding the raw per-user detail (IPs, timestamps) as soon as it closes.
#
# What this does NOT bound is correspondence metadata itself (who emailed whom,
# at what size): that is a routing necessity and cannot be hidden. What is
# bounded is how long the *record* of it persists on disk.

# --- base system ----------------------------------------------------------
/var/cron/log				600  3     10   *     Z
/var/log/daemon				640  5     300  *     Z
/var/log/lpd-errs			640  7     10   *     Z
/var/log/messages			644  5     300  *     Z
/var/log/secure				600  7     *    168   Z
/var/log/wtmp				644  7     *    $M1D4 B ""
/var/log/xferlog			640  7     250  *     Z
/var/log/pflog				600  3     250  *     ZB "pkill -HUP -u root -U root -t - -x pflogd"

# --- the website ----------------------------------------------------------
# The base file names /var/www/logs, which was right before the hosting change
# moved httpd's chroot to /home/www (#154). httpd appends /logs to whatever
# chroot it runs in (HTTPD_LOGROOT in httpd.c), so the live files are
# /home/www/logs/*, and the base's lines were rotating a tree nothing writes to
# any more while the live access log grew unbounded. httpd reopens its log on
# SIGUSR1, which is what the command column sends.
/home/www/logs/access.log		644  4     *    $W0   Z "pkill -USR1 -u root -U root -x httpd"
/home/www/logs/error.log		644  7     250  *     Z "pkill -USR1 -u root -U root -x httpd"

# --- mail: smtpd (envelope, mta relay) and Dovecot (auth) -----------------
# The highest-privacy log here: sender and recipient pairs, timestamps, message
# sizes and auth results. Bound hard, and daily rather than the weekly the base
# file used for auth, so the window is the one the runbook and the monitor
# describe.
/var/log/maillog	root:wheel	600	7	*	$D0	Z

# --- auth: sshd failures, and the onboarding TUI's admission lines ---------
# Per-account, per-source-IP auth attempts. The raw IP is the exposure; it is
# discarded at rotation, and scripts/abuse-monitor.sh keeps only the *count*,
# never a per-IP identifier (CONTEXT.md, "log minimization").
/var/log/authlog	root:wheel	600	7	*	$D0	Z

# --- DNS: nsd zone-transfer and notify logging ----------------------------
# Lower sensitivity (DNS queries are not mail correspondence) but bounded all
# the same; openbsd/etc/nsd/nsd.conf points its logfile here. nsd holds the file
# open, so rotating it away without telling nsd would leave the daemon writing
# to a renamed file and the log would be lost: nsd-control(8) `log_reopen` is
# the documented mechanism for exactly this, and newsyslog runs it from the
# command column.
/var/log/nsd.log	_nsd:_nsd	640	7	*	$D0	Z	"/usr/sbin/nsd-control log_reopen"
