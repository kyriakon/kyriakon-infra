# relayd.conf - the TLS front end for every name this box serves over HTTPS.
#
# On-box path: /etc/relayd.conf. Installed by scripts/deploy-relayd.sh, which
# also links the certificates into the names relayd looks them up under, checks
# the file with `relayd -n`, and starts the daemon. Nothing here is edited by
# hand on the box; a change is a pull request and one command.
#
# Why relayd holds 443 and httpd does not. There is one 443 socket on this box
# and only one daemon can own it: OpenBSD allows a duplicate bind when every
# socket sets SO_REUSEPORT, and both httpd and relayd do, so two listeners on
# 443 either fail to start or split the traffic between them, which would serve
# half the requests for this hostname from the wrong place and half the requests
# for every other hostname from this relay. So relayd terminates TLS for all of
# them and httpd serves each vhost on the loopback port relayd forwards to,
# plain HTTP, with the Host header deciding the vhost as it always has. That is
# the reason httpd.conf's 443 vhosts listen on 127.0.0.1 port 8080, and why the
# certificate blocks left that file when this one gained the keypairs.
#
# Where the certificates come from. acme-client writes one pair per name under
# its own two filenames; relayd looks a keypair up under /etc/ssl/<name>.crt and
# /etc/ssl/private/<name>.key. The deploy links the first to the second rather
# than copying a certificate, so a renewal under the acme-client name is what
# relayd serves after its next reload.
#
# Per name or per certificate. libtls, which relayd uses for TLS, matches the
# client's SNI against the names inside each certificate rather than against the
# keypair's label, and falls back to the first keypair when the client sends a
# name no certificate covers. One line per certificate is therefore enough: the
# apex pair carries kyriakon.net, www, kleio, press and signup as alternative
# names, so a request for any of those is served the apex certificate without a
# line of its own, and the first line below is the default for a client that
# sends no SNI at all.
#
# Member names are the gap: a member's own certificate is issued later, and
# relayd can only present what this file names, so scripts/provision-member-web.sh
# (which writes the member's httpd vhost on the loopback port) is the script that
# also has to add that member's line here and reload. Until it does, a member
# name answers with the default certificate above. Noted rather than guessed:
# the member certificate queue is #166's, and it is not built.

table <httpd>   { 127.0.0.1 }
table <onboard> { 127.0.0.1 }

http protocol "kyriakon-https" {
	# The handler's counters key on the last element of this header
	# (onboard/src/rate.rs), because a limit a caller can rename is not a
	# limit. `set` replaces a client-supplied value rather than appending to
	# one, so what the handler reads is the address relayd observed, and a
	# forged header cannot buy a fresh allowance.
	match header set "X-Forwarded-For" value "$REMOTE_ADDR"
	# httpd no longer sees the client address, only relayd, so its access log
	# records this pair instead: `log { style forwarded }` in the loopback
	# vhosts appends X-Forwarded-For and X-Forwarded-Port to the combined line.
	match header set "X-Forwarded-Port" value "$SERVER_PORT"

	pass

	# The dynamic half of the signup hostname: the form, the submission and the
	# account page, which is the handler's three routes. Host and path are both
	# matched because every other name is carried by the same protocol, and a
	# page called /apply on one of them is that site's page, not the form.
	# Everything not matched here stays on the main table below, httpd, which is
	# the static half of the same hostname: the document root it served before
	# this relay existed. A route added to the handler needs a line here, or it
	# lands on the static root and answers 404.
	#
	# The trailing * on the host is deliberate: a client may send the port
	# (Host: signup.kyriakon.net:443), and httpd ignores the port when it picks a
	# vhost, so the relay has to ignore it too or the form would 404 while the
	# static half of the same name kept working.
	match request header "Host" value "signup.kyriakon.net*" path "/" forward to <onboard>
	match request header "Host" value "signup.kyriakon.net*" path "/apply" forward to <onboard>
	match request header "Host" value "signup.kyriakon.net*" path "/status/*" forward to <onboard>

	# One keypair per certificate, each its own statement. relayd.conf(5) on this
	# box gives the option as `tls option` with `keypair name` in its list of
	# valid options, and says of keypair that it "can be specified multiple times
	# for TLS Server Name Indication", which is this shape rather than a
	# comma-separated list inside one tls block. The first keypair is the
	# default, so it is what a client that sends no SNI is served, and the names
	# inside each certificate are what libtls matches the client's SNI against.
	# A member's certificate line belongs here with them; see the header.
	tls keypair "kyriakon.net"
	tls keypair "kyriakon.com"
	tls keypair "oliver.kyriakon.net"
}

relay "https" {
	# egress is vio0's interface group, so this binds the box's public IPv4 and
	# IPv6 addresses and follows a rebuilt box whose addresses change. 443 needs
	# no pf rule either way: the box runs the stock ruleset, which passes it.
	listen on egress port 443 tls
	protocol "kyriakon-https"

	# httpd on the loopback port, for every name and every path the rules above
	# did not claim. The relay reaches it over loopback, so that port is not
	# reachable from off the box and needs no rule of its own.
	forward to <httpd> port 8080
	# The handler, declared here because a rule can only forward to a table this
	# section declares (relayd.conf(5), "forward to <table>" under the filter
	# rules: "A corresponding forward to declaration in the Relays section is
	# required"). 127.0.0.1:7080 is its only listener, loopback only, from
	# openbsd/etc/onboard/onboard.toml. This line is that declaration, not a
	# failover target: the same man page says a second entry here "will be used as
	# the backup table if all hosts in the previous table are down", and no
	# example pairs that sentence with a rule that selects a table itself. The
	# deploy settles it by asking for signup's form: a 200 is the handler
	# answering, so the rule chose this table; a 404 is httpd's empty root
	# answering, so it did not.
	forward to <onboard> port 7080
}

# The Titan upload listener is deliberately not live, and this is what would
# have to exist first. It presents the capsule's certificate rather than the
# site's, so that a gemini client which has pinned gemini://signup.kyriakon.net
# keeps its pin when the same hostname answers Titan on this port, and it
# forwards with PROXY protocol v1 so the handler can still see the client
# address on a listener that is not HTTP.
#
# The certificate half is settled. The tracked gmid.conf names the capsule pair,
# and scripts/deploy-mail.sh generates that pair when either half is missing
# before it installs that config, so a box the deploy has reached holds
# /etc/ssl/capsule-kyriakon.net.crt and its key.
#
# One half is still missing, and it is handler work rather than a relay setting.
# The handler has no second listener to forward to. onboard.toml configures one
# address and port for the whole service, and the crate has no PROXY-protocol
# parsing, so a forward would prepend a PROXY line to the front of an axum HTTP
# request that nothing on the other end can consume.
#
# The port is the one decision left to the Titan build: Titan is conventionally
# served on the gemini port, which gmid holds on this box, so it needs a port of
# its own and a pf fragment for it (propose-only, like the others, and filed by
# whoever opens the port). Once that listener exists this becomes:
#
# tcp protocol "titan-upload" {
# 	# The capsule pair's names, which are exactly what relayd looks up:
# 	# /etc/ssl/capsule-kyriakon.net.crt and
# 	# /etc/ssl/private/capsule-kyriakon.net.key, generated by
# 	# scripts/deploy-mail.sh.
# 	tls keypair "capsule-kyriakon.net"
# }
#
# relay "titan" {
# 	listen on egress port 1966 tls
# 	protocol "titan-upload"
# 	forward to 127.0.0.1 port 7081 proxy-protocol v1
# }
