# httpd.conf - kyriakon.net web serving.
#
# On-box path: /etc/httpd.conf. httpd chroots to /home/www, so root "/acme"
# resolves to /home/www/acme and root "/kyriakon.net/www" to
# /home/www/kyriakon.net/www. The chroot holds public content only: a member's
# Maildir and git repositories live under /home/<name>, outside it, so a fault in
# the web daemon cannot reach them. The one member directory inside the chroot is
# that member's own public tree, which their upload session is already chrooted
# to.
#
# The chroot also decides the log directory. With no logdir set, httpd appends
# /logs to the chroot (HTTPD_LOGROOT in httpd.c), so httpd writes
# /home/www/logs. httpd does not create that directory and a missing one stops it
# starting, so the deploy creates it owned root:daemon 0755, the way
# /var/www/logs was owned before the move.
#
# Scope: the mail host's ACME endpoint, the landing site, the operator's personal
# site, the two project hostnames and the signup hostname. Port 80 is served
# directly; every 443 vhost here answers on loopback behind relayd, which owns
# 443 and terminates TLS for all of them. Per-member static hosting is not
# written here: it arrives as one generated file per member under /etc/httpd.d,
# and this file includes the generated index only. No daemon in this stack can
# include a directory (each include is one path passed to fopen), so the signup
# path writes the member file first and then rewrites the index that lists it.
#
# A generated member file has this shape, and only the signup path writes one:
#
#   server "alice.kyriakon.net" {
#       listen on * port 80
#       location "/.well-known/acme-challenge/*" {
#           root "/acme"
#           request strip 2
#       }
#       location "/*" {
#           block return 301 "https://alice.kyriakon.net$REQUEST_URI"
#       }
#   }
#
#   server "alice.kyriakon.net" {
#       listen on 127.0.0.1 port 8080
#       location "/.git/*" {
#           block
#       }
#       location "/*" {
#           root "/alice.kyriakon.net/www"
#       }
#   }
#
# The port 80 block is written at signup and comes first, and the loopback block
# only once the member's own certificate file exists. Serving a name over TLS
# with another name's certificate is worse than not serving it, and a member
# whose certificate is still queued behind the Let's Encrypt refill has a
# resolving name and a working challenge in the meantime. The certificate half
# of the member's HTTPS is relayd's now, not this file's: the member's loopback
# block decides what the site serves, and a keypair line in /etc/relayd.conf
# decides which certificate the relay presents for the name. Adding that line is
# scripts/provision-member-web.sh's job, on the run that sees the certificate
# land, and until it does a member name is answered with the relay's default
# certificate.
#
# Three rules that are easy to get wrong here:
#
#   The challenge location has to come first in each port 80 vhost, because
#   httpd uses the first matching location and ignores the rest. A catch-all
#   matched earlier would shadow it and break certificate renewal.
#
#   Every name the certificate covers needs its own port 80 vhost, since
#   acme-client only does HTTP-01. Port 443 needs no challenge location.
#
#   The order sections are defined in decides which one serves a request when two
#   of them match the name, because httpd takes the first match rather than the
#   most specific. A section matching every name therefore has to be defined last,
#   after the generated member index and every named vhost; the catch-all at the
#   foot of this file is that section and its comment carries the rule, the reading
#   it comes from, and why the gate is not in the relay.
#
# 443 belongs to relayd, and every HTTPS vhost in this file is behind it. There
# is one 443 socket on the box and only one daemon can own it: OpenBSD permits a
# duplicate bind when every socket sets SO_REUSEPORT, and httpd does, so httpd
# and a relay both listening on 443 would either fail to start or share the
# traffic between them, serving half the requests for a name from the wrong
# place. The relay therefore terminates TLS for every name and forwards every
# request for one to the vhost below that names it, chosen by the Host header it
# passes through untouched. /etc/relayd.conf carries the certificates, the
# forwarded address the onboarding counters key on, and the reason each piece is
# where it is; scripts/deploy-relayd.sh installs it, and nothing below answers
# until it has run.
#
# The onboarding service is the one thing here that is not served from a root.
# It is a FastCGI responder on a unix socket under the chroot, and the signup
# vhost hands it the form, the submission and the status page the way any other
# FastCGI front-end hands a request to its handler; the comment on that block
# says which variables it reads and why the socket is where it is.
#
# The `log { style forwarded }` line in those vhosts is not decoration: with the
# client one hop away the address httpd sees is 127.0.0.1, and the forwarded
# style appends the two headers the relay sets so the access log keeps naming
# the client it always named. It also keeps the client address reaching the
# responder, which reads the same header for the same reason.
#
# No pf change is needed for 443. The box runs the stock OpenBSD ruleset
# (block return all, pass all flags S/SA), which permits it, and the loopback
# port the relay forwards to is not reachable from off the box at all.
#
# The port 80 vhosts for the names above are untouched: a client reaches them
# directly, so they keep serving the HTTP-01 challenge and the redirect to https,
# and acme-client keeps validating every name it issues for.

chroot "/home/www"

# Mail host, HTTPS half. Every 443 vhost here answers behind relayd, and the relay
# picks the vhost by the Host header it forwards untouched. Nothing on this
# listener named this host, and httpd answers a request for a name no server
# section matches with the first section on the port, so the mail hostname served
# the landing site: a certificate valid for mail.kyriakon.net with kyriakon.net's
# pages behind it. A mail host publishes no web surface, so this refuses rather
# than redirecting, and the refusal is a 404 because the honest answer to a
# request for a page here is that there is none.
#
# It is also the first section on the loopback listener, and it is meant to stay
# there: a request that matches no section at all, because it carries no Host
# header or a Host naming a port this listener does not hold, is handled by the
# first section defined on the port. A refusal in that position is what keeps
# that path safe whatever the generated member files hold, so a new loopback
# vhost belongs below this one.
server "mail.kyriakon.net" {
	listen on 127.0.0.1 port 8080
	log { style forwarded }
	location "/*" {
		block return 404
	}
}

# Mail host. smtpd and Dovecot terminate their own TLS, so this vhost exists
# for one reason: the HTTP-01 challenge that renews their certificate. Nothing
# else is served here, hence no redirect.
server "mail.kyriakon.net" {
	listen on * port 80
	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}
}

# The landing site. index.html is httpd's default directory index, so no
# directory rule is needed. The document root is a git checkout, so .git is
# blocked rather than served: a browsable repository over HTTP is a source
# leak, not a feature.
#
# /kleio/ and /press/ were paths on this site until each project got its own
# hostname. Both now redirect to that hostname, so a link minted in an email or a
# document still lands somewhere. There is no path-for-path mapping and none is
# pretended: the project page lives at the root of its own hostname, so the whole
# subtree goes to that root. The bare path needs its own rule because
# location "/kleio/*" does not match "/kleio".
server "kyriakon.net" {
	listen on 127.0.0.1 port 8080
	log { style forwarded }
	location "/.git/*" {
		block
	}
	location "/kleio" {
		block return 301 "https://kleio.kyriakon.net/"
	}
	location "/kleio/*" {
		block return 301 "https://kleio.kyriakon.net/"
	}
	location "/press" {
		block return 301 "https://press.kyriakon.net/"
	}
	location "/press/*" {
		block return 301 "https://press.kyriakon.net/"
	}
	location "/*" {
		root "/kyriakon.net/www"
	}
}

# www is not canonical: same site, one name in the index. It is served from the
# apex certificate the relay presents, so it answers on TLS and redirects to the
# apex rather than resolving to something that refuses.
server "www.kyriakon.net" {
	listen on 127.0.0.1 port 8080
	log { style forwarded }
	location "/*" {
		block return 301 "https://kyriakon.net$REQUEST_URI"
	}
}

# Plain HTTP is now only the challenge and a redirect to TLS.
server "kyriakon.net" {
	listen on * port 80
	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}
	location "/*" {
		block return 301 "https://kyriakon.net$REQUEST_URI"
	}
}

# Defensive domain, registered so nobody else can use the name, so it serves one
# thing: a redirect to the canonical name. The relay presents its own pair for
# it rather than the apex certificate, because a request for kyriakon.com served
# a certificate with the wrong name on it is worse than refusing the connection.
# That pair is the second keypair line in /etc/relayd.conf's tls block.
server "kyriakon.com" {
	listen on 127.0.0.1 port 8080
	log { style forwarded }
	location "/*" {
		block return 301 "https://kyriakon.net$REQUEST_URI"
	}
}

# Its own HTTP-01 challenge so that certificate can renew, plus the same
# redirect for anyone who arrives on plain HTTP.
server "kyriakon.com" {
	listen on * port 80
	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}
	location "/*" {
		block return 301 "https://kyriakon.net$REQUEST_URI"
	}
}

server "www.kyriakon.net" {
	listen on * port 80
	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}
	location "/*" {
		block return 301 "https://kyriakon.net$REQUEST_URI"
	}
}

# The operator's personal site. Same shape as the landing site above: a git
# checkout is the document root, so .git is blocked rather than served. No
# www alias and no alternative names on the certificate: nothing links to
# www.oliver.kyriakon.net, and the wildcard DNS record resolves it to this box
# either way, so a name nobody types is a vhost plus a cert SAN for nothing.
server "oliver.kyriakon.net" {
	listen on 127.0.0.1 port 8080
	log { style forwarded }
	location "/.git/*" {
		block
	}
	location "/*" {
		root "/oliver.kyriakon.net/www"
	}
}

server "oliver.kyriakon.net" {
	listen on * port 80
	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}
	location "/*" {
		block return 301 "https://oliver.kyriakon.net$REQUEST_URI"
	}
}

# The two project hostnames. Each is canonical for its project, so the paths
# above redirect here and nothing links to the old paths again. Both reuse the
# apex certificate as alternative names rather than getting one of their own:
# they already had to answer on the apex certificate's renewal, and a SAN on an
# existing certificate costs no issuance against the 50-per-registered-domain
# limit. The document root follows the same shape a member's site uses, so the
# whole public surface is one chroot and one backup set. Neither root is a git
# checkout (the site's own build writes them, as it does for the landing site),
# so a .git block would be dead config; add one here if that ever changes.
server "kleio.kyriakon.net" {
	listen on 127.0.0.1 port 8080
	log { style forwarded }
	location "/*" {
		root "/kleio.kyriakon.net/www"
	}
}

server "kleio.kyriakon.net" {
	listen on * port 80
	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}
	location "/*" {
		block return 301 "https://kleio.kyriakon.net$REQUEST_URI"
	}
}

server "press.kyriakon.net" {
	listen on 127.0.0.1 port 8080
	log { style forwarded }
	location "/*" {
		root "/press.kyriakon.net/www"
	}
}

server "press.kyriakon.net" {
	listen on * port 80
	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}
	location "/*" {
		block return 301 "https://press.kyriakon.net$REQUEST_URI"
	}
}

# The signup hostname, fixed for the form and the account page. The port 80 block
# is what validates the name for the apex certificate, so it has to exist even
# though the form itself is not built yet.
#
# This block is the whole name behind the relay: the static half, which is
# everything the name publishes, and the dynamic half, which is the onboarding
# service's three routes reached over FastCGI. The service is a responder on a
# unix socket rather than an HTTP daemon on a loopback port, so this daemon does
# the HTTP parsing for it and hands it a request the same way it would hand one to
# slowcgi.
server "signup.kyriakon.net" {
	listen on 127.0.0.1 port 8080
	log { style forwarded }

	# The service's socket is a path inside this daemon's chroot, so
	# /run/onboard-httpd/httpd.sock here is /home/www/run/onboard-httpd/httpd.sock
	# on disk. gmid's socket is resolved after the same chroot and sits in its own
	# directory beside it. One socket each because each daemon runs as a
	# different user (www here, _gmid there) and a socket file carries one group;
	# the directory is set-group-id with the connecting daemon's group, which is
	# what gives the socket its owner. Nothing else may connect: a local user who
	# could would forge the whole environment, REMOTE_ADDR included, which is the
	# address the service's rate limits key on.
	#
	# httpd uses the first matching location and ignores the rest, so the three
	# routes come before the catch-all root below, and a route added to the
	# service needs a location here or it lands on the static root and answers
	# 404.
	#
	# The service reads REQUEST_URI, REQUEST_METHOD, QUERY_STRING, CONTENT_TYPE,
	# the request body and the two address variables from what this daemon
	# passes it. It reads no SCRIPT_NAME, no PATH_INFO and no DOCUMENT_ROOT, and
	# it does not need a root here: there is no file behind these routes.
	location "/" {
		fastcgi socket "/run/onboard-httpd/httpd.sock"
	}
	location "/apply" {
		fastcgi socket "/run/onboard-httpd/httpd.sock"
	}
	location "/status/*" {
		fastcgi socket "/run/onboard-httpd/httpd.sock"
	}

	location "/*" {
		root "/signup.kyriakon.net/www"
	}
}

server "signup.kyriakon.net" {
	listen on * port 80
	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}
	location "/*" {
		block return 301 "https://signup.kyriakon.net$REQUEST_URI"
	}
}

# The generated index of per-member vhosts. It has to exist before httpd starts:
# include opens one file with fopen and a missing file fails the whole
# configuration rather than being skipped. An empty index is valid, which is what
# the deploy leaves here before any member exists.
#
# It is included at the foot of the file rather than the head because sections are
# matched in the order they are defined, which the catch-all below explains in
# full. The index has to come before that catch-all, so a member's name is matched
# by the member's own block rather than refused, and after every section written
# here, so the first section on each listener stays one of this file's own: that
# first section is what answers a request naming nothing this file knows. Nothing
# the index holds changes: it still lists one file per member, in the order the
# directory hands them over.
include "/etc/httpd.d/index.conf"

# The catch-all: every name no section above names is refused here. It has to be
# the last section in the file, and the rule that says so is the tie-break
# httpd.conf(5) at 7.9 does not state. The manual gives only the fallback, that a
# request matching no server name is handled by the first section defined on its
# listening port, and says nothing about how httpd chooses when two sections both
# match. The choice is not in the pattern rules either: `server` matches the name
# with glob(7) and `server match` with patterns(7), and that only picks the
# matcher, not the precedence. It is in the code, and the code is a scan in
# definition order: server_http.c walks the sections configured on the listening
# port and stops at the first one whose name matches the Host header, and
# config_getserver appends every later section sharing that address and port to
# the tail of the same list, so the order walked is the order in this file. There
# is no most-specific rule. A section matching every name placed before the named
# vhosts would shadow all of them, and this file's own challenge locations show the
# same first-match-wins rule inside a vhost. Placed last it shadows nothing: every
# named vhost above, and every member vhost in the index above, is matched first.
#
# A name the wildcard DNS record resolves that no section names gets this 404
# rather than another site's pages. Refusal rather than a redirect to the canonical
# name, which is what www and kyriakon.com do: those are names the platform means
# to answer on, while this is the set of names nobody configured, some of them
# deliberate and some of them accidents. The status is the mail host's 404, for the
# same reason: the honest answer to a request for a page on a name with no site is
# that there is no page.
#
# Not in the relay instead, which is worth answering since relayd holds the
# keypairs and picks one per name. It cannot refuse a name before httpd is reached:
# libtls matches the client's SNI against the names in the certificates
# /etc/relayd.conf gives it and falls back to the first keypair for a name no
# certificate covers, rather than failing the handshake, so the request arrives
# here whatever happens at the handshake. relayd's tls block takes keypairs and
# nothing that refuses a name, and a rule in the http protocol there would have to
# name every served host again, in a second file kept in step with this one by
# hand. That is the arrangement #400 removed for the service's routes, and it would
# leave port 80 unanswered besides.
#
# The second section repeats it for plain HTTP. Port 80 has the same rule and the
# same first-section fallback, and a browser asks for a name typed without a scheme
# over http first, so leaving port 80 to the fallback is how a name with no site
# ends up served another name's redirect. Every name that needs an HTTP-01
# challenge has its own port 80 vhost above, a member's written at signup, so this
# refuses a name that has none and cannot interrupt a renewal. It carries no
# challenge location of its own, because a challenge is only ever served for a name
# whose own vhost is above.
#
# A member whose certificate is still queued is refused here, and that is the
# wanted answer. Their port 80 block exists from signup, so the challenge that
# issues the certificate is served, and their loopback block appears only when the
# certificate does, so on the days between the two the name has a working challenge
# and no site rather than another name's pages under a certificate that does not
# carry it.
server "*" {
	listen on 127.0.0.1 port 8080
	log { style forwarded }
	location "/*" {
		block return 404
	}
}

server "*" {
	listen on * port 80
	location "/*" {
		block return 404
	}
}
