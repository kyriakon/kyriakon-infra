# httpd.conf - kyriakon.net, bootstrap config.
#
# On-box path: /etc/httpd.conf. This exists so acme-client can publish its
# HTTP-01 challenge file before the real site lands; static and per-user
# hosting extend it later. httpd chroots to /var/www, so root "/acme" resolves
# to /var/www/acme, which is acme-client's default challenge directory.

server "mail.kyriakon.net" {
	listen on * port 80
	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}
}
