# httpd.conf - kyriakon.net web serving.
#
# On-box path: /etc/httpd.conf. httpd chroots to /var/www, so root "/acme"
# resolves to /var/www/acme (acme-client's default challenge directory) and
# root "/kyriakon.net" to /var/www/kyriakon.net, where the kyriakon-site
# checkout is deployed.
#
# Scope today: the mail host's ACME endpoint and the landing site over plain
# HTTP. TLS for the site is issue #55 phase 2 and lands with the pf rule that
# opens port 443, since a listener on a port nothing can reach only hides the
# certificate state. Per-user static hosting (username.kyriakon.net) extends
# this file later, one vhost per user.
#
# Every vhost that the site certificate covers needs its own challenge
# location, and the challenge location has to come first: httpd uses the first
# matching location and ignores the rest, so a catch-all matched earlier would
# shadow it and break renewal.

# Mail host. smtpd and Dovecot terminate their own TLS, so this vhost exists
# for one reason: the HTTP-01 challenge that renews their certificate.
server "mail.kyriakon.net" {
	listen on * port 80
	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}
}

# Landing site. The document root is a git checkout, so .git is blocked rather
# than served: a browsable repository over HTTP is a source leak, not a feature.
server "kyriakon.net" {
	listen on * port 80
	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}
	location "/.git/*" {
		block
	}
	location "/*" {
		root "/kyriakon.net"
	}
}

# www is not canonical: same site, one name in the index, so it redirects to
# the apex rather than serving a second copy.
server "www.kyriakon.net" {
	listen on * port 80
	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}
	location "/*" {
		block return 301 "http://kyriakon.net$REQUEST_URI"
	}
}
