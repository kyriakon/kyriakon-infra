# acme-client.conf - kyriakon.net certificate issuance.
#
# On-box path: /etc/acme-client.conf. acme-client implements HTTP-01 only
# (not DNS-01), so every certificate here is issued per hostname and served
# through the challenge location in httpd.conf. There is no wildcard
# certificate, which is why each signup gets its own cert for
# username.kyriakon.net.
#
# challengedir is set on every domain block, because it is a per-domain option
# ("duplicate challengedir" is an error within one block) and the default of
# /var/www/acme no longer matches anything httpd serves: httpd chroots to
# /home/www, so its root "/acme" is /home/www/acme, and a challenge file written
# to the old path would be outside the chroot and never read. A generated member
# domain block has to carry the same line for the same reason.
#
# Only the apex certificate takes alternative names. Each name in a certificate
# is validated over its own HTTP-01 challenge, so every name listed here also
# needs its own port 80 vhost in httpd.conf; adding a name without one makes the
# whole order fail rather than just that name.

authority letsencrypt {
	api url "https://acme-v02.api.letsencrypt.org/directory"
	account key "/etc/acme/letsencrypt-privkey.pem"
}

# Mail hostname: the same certificate is installed in smtpd (pki block) and
# Dovecot (ssl_cert/ssl_key), so the paths here must match both configs.
#
# It keeps its own certificate rather than joining the apex's alternative names.
# Folding it in would save one issuance per renewal against a budget member
# certificates dominate anyway, and it would put the certificate that must never
# lapse on the same order as the web names: one name failing validation takes the
# whole order down. Isolation is worth more than the slot.
domain mail.kyriakon.net {
	challengedir "/home/www/acme"
	domain key "/etc/ssl/private/mail.kyriakon.net.key"
	domain full chain certificate "/etc/ssl/mail.kyriakon.net.fullchain.pem"
	sign with letsencrypt
}

# Landing site, and every hostname the platform answers under its own name.
# HTTP-01 only, so each name below has a port 80 vhost in httpd.conf.
#
# www is an alternative name because it redirects to the apex and so has to
# answer on TLS before it can redirect. kleio and press joined it when the two
# projects moved off the paths under kyriakon.net, and signup when it became the
# fixed hostname for the form and the account page. An alternative name on an
# existing certificate costs no issuance, so the four names share one renewal
# against the per-registered-domain limit rather than four.
domain kyriakon.net {
	alternative names {
		www.kyriakon.net
		kleio.kyriakon.net
		press.kyriakon.net
		signup.kyriakon.net
	}
	challengedir "/home/www/acme"
	domain key "/etc/ssl/private/kyriakon.net.key"
	domain full chain certificate "/etc/ssl/kyriakon.net.fullchain.pem"
	sign with letsencrypt
}

# Defensive domain: it redirects to the apex and never sends mail. It gets its
# own certificate rather than an alternative name on kyriakon.net's, so a
# validation failure on one name cannot take the other's renewal down with it.
# HTTP-01 like the rest, so the challenge is served by the kyriakon.com port 80
# vhost in httpd.conf.
domain kyriakon.com {
	challengedir "/home/www/acme"
	domain key "/etc/ssl/private/kyriakon.com.key"
	domain full chain certificate "/etc/ssl/kyriakon.com.fullchain.pem"
	sign with letsencrypt
}

# Oliver's personal site. HTTP-01 like the rest, so the challenge is served by
# the matching port 80 vhost in httpd.conf. No alternative names: the site
# answers on one name only (see the vhost comment).
domain oliver.kyriakon.net {
	challengedir "/home/www/acme"
	domain key "/etc/ssl/private/oliver.kyriakon.net.key"
	domain full chain certificate "/etc/ssl/oliver.kyriakon.net.fullchain.pem"
	sign with letsencrypt
}

# --- generated member blocks ----------------------------------------------
#
# One domain block per member name lives in /etc/acme-client.d/, written by the
# signup path and listed by the index below. That is the same shape httpd.conf
# and gmid.conf use, and for the same reason: no config in this stack can include
# a directory, so a file the signing path regenerates lists what is present.
#
# Naming it here does not put member names into the daily lane. renew-acme.sh
# reads the handles out of this top level with an awk, so the member blocks are
# parsed by acme-client but never renewed by that script; a member's certificate
# is issued through the queue the drain runs. The comment above the names in
# renew-acme.sh says the same thing from the other side.
#
# The parse is shared, which is the one cost of the arrangement: every renewal on
# the box reads this file, so a member block that does not parse fails the daily
# lane for names that have nothing to do with it, and the renewal-failure alert
# is what reports it. The drain writes those blocks temp-then-rename for that
# reason.
include "/etc/acme-client.d/index.conf"
