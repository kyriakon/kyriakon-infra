# acme-client.conf - kyriakon.net certificate issuance.
#
# On-box path: /etc/acme-client.conf. acme-client implements HTTP-01 only
# (not DNS-01), so every certificate here is issued per hostname and served
# through the challenge location in httpd.conf. There is no wildcard
# certificate, which is why each signup gets its own cert for
# username.kyriakon.net.

authority letsencrypt {
	api url "https://acme-v02.api.letsencrypt.org/directory"
	account key "/etc/acme/letsencrypt-privkey.pem"
}

# Mail hostname: the same certificate is installed in smtpd (pki block) and
# Dovecot (ssl_cert/ssl_key), so the paths here must match both configs.
domain mail.kyriakon.net {
	domain key "/etc/ssl/private/mail.kyriakon.net.key"
	domain full chain certificate "/etc/ssl/mail.kyriakon.net.fullchain.pem"
	sign with letsencrypt
}

# Landing site. HTTP-01 only, so the challenge is served by the kyriakon.net
# and www.kyriakon.net vhosts in httpd.conf. www is an alternative name because
# it redirects to the apex and so has to answer on TLS before it can redirect.
domain kyriakon.net {
	alternative names { www.kyriakon.net }
	domain key "/etc/ssl/private/kyriakon.net.key"
	domain full chain certificate "/etc/ssl/kyriakon.net.fullchain.pem"
	sign with letsencrypt
}

# Oliver's personal site. HTTP-01 like the rest, so the challenge is served by
# the matching port 80 vhost in httpd.conf. No alternative names: the site
# answers on one name only (see the vhost comment).
domain oliver.kyriakon.net {
	domain key "/etc/ssl/private/oliver.kyriakon.net.key"
	domain full chain certificate "/etc/ssl/oliver.kyriakon.net.fullchain.pem"
	sign with letsencrypt
}
