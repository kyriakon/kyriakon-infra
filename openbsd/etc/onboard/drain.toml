# /etc/kyriakon/onboard/drain.toml
#
# The onboarding drain's configuration, installed from
# openbsd/etc/onboard/drain.toml by scripts/deploy-onboard.sh. Unlike the
# handler's own /etc/onboard/onboard.toml, this file is root-only and sits in
# the drain's own home: it names the secret files and the privileged scripts the
# drain runs as root, so nothing about it is for the unprivileged half.
#
# No deploy substitutes a path into it except the release below, and every path
# in it is a value rather than a compiled-in default. That is what lets the
# acceptance tests point the whole service at fixtures under a temporary
# directory and run the real binaries with no root.

# The store root the drain owns. The handler reads two files at the top of it
# and writes intents/ and applications/; everything else under it is the
# drain's, which is the privilege split the spec fixes.
store_root = "/var/db/onboard"

# The names the platform holds back, 0644 at the top of the store, installed
# there by scripts/onboard-store.sh. The handler refuses them when an
# application is filed; the drain checks the same file, because it is the half
# that creates the account, the address and the subdomain, and it must not take
# the filing half's answer for a rule this one enforces as root. Named here
# rather than derived from the store root, for the reason the handler's own
# config gives: a later layout moves the file rather than the service reading an
# empty list and holding nothing back.
reserved = "/var/db/onboard/reserved-usernames.txt"

# The directory the drain's privileged scripts are installed in. It invokes
# add-user.sh, provision-member.sh and delete-user.sh by their configured paths,
# and those run quota-apply.sh, provision-member-web.sh,
# provision-member-capsule.sh and cron-apply.sh in turn, so the whole set lives
# here. scripts/deploy-onboard.sh installs them, and the tracked login class that
# provision-member.sh reads beside them, and checks every script is executable
# before the unit starts. A test points this at stubs under a temporary
# directory.
scripts = "/usr/local/libexec/kyriakon/scripts"

# The local enqueuer. Every notice leaves through it and is DKIM-signed by the
# smtpd that owns the queue, so nothing here signs or relays anything itself.
sendmail = "/usr/sbin/sendmail"

# The box's own account list. The drain reads it, rather than running id(1), to
# decide whether a username is already in use: an account made any other way,
# by the operator or by provision-member.sh run by hand, has no record under the
# store, and the drain must neither adopt it nor release its name.
passwd = "/etc/passwd"

# The virtual table's two files. deploy-mail.sh seeds /etc/mail/mail_domains
# with the platform's own domain and /etc/mail/virtuals with the platform
# aliases; the drain adds a body's domain and one full-address entry per
# address on approval. Both are values rather than compiled-in paths for the
# reason passwd is: a test points them at fixtures.
mail_domains = "/etc/mail/mail_domains"
virtuals = "/etc/mail/virtuals"

# The DKIM filter's domain list. A body's domain is appended when its group is
# provisioned, so the platform's one key signs the body's mail at the selector
# the body publishes. The filter's `-d` list is spliced into smtpd.conf from
# this file by scripts/deploy-mail.sh, which is the batched configuration pass;
# until it runs, the domain is listed and not yet signed.
dkim_domains = "/etc/mail/dkim_domains"

# The root-only HMAC-SHA256 key the review email's three links and the one-time
# password link are signed with. The drain signs and verifies with it; the
# handler never reads it, because it only passes a click through as an intent.
approval_key = "/etc/kyriakon/onboard/approval-signing-key"

# The box keyring the encrypting LMTP reads: one `<localpart>.asc` per account,
# which scripts/deploy-mail.sh seeds from the tracked keys/ at deploy time. An
# approved member's mail key is written here by the drain before anything can
# deliver to the account, because the encryptor fails closed without it.
keyring_dir = "/etc/kyriakon/keys"

# Stripe's signing secret and the keyring publish token. The drain reads the
# token and passes its path to scripts/publish-mail-key.sh, which opens an
# approved member's key against the public repository; the card rail is a later
# ticket and reads nothing from its own file yet. Both are named here so the one
# root-only home for the service's secrets is fixed in one place rather than
# invented per ticket.
stripe_webhook_secret = "/etc/kyriakon/onboard/stripe-webhook-secret"
keyring_publish_token = "/etc/kyriakon/onboard/keyring-publish-token"

# The one reviewer the whole application is mailed to. Every answer, the
# mail-key result, whether an upload key was supplied, the rail, the no-charge
# flag and the three signed links arrive in one message so the decision can be
# made from a phone.
reviewer = "admin@kyriakon.net"

# The sender every notice leaves as. The enqueuer fills a From header from the
# account that ran it, and the drain runs as root, so a member's approval mail
# read "Charlie Root <root@mail.kyriakon.net>" until this was named. hello@ is the
# address the platform already publishes for people to write to.
from = "kyriakon <hello@kyriakon.net>"

# The base URL the signed links point at. relayd terminates TLS for this
# hostname and passes the request to the handler on loopback.
base_url = "https://signup.kyriakon.net"

# The yearly price, as the ledger records it. A configuration value because the
# Stripe Price and the prepaid price have to agree and neither belongs in a
# literal.
price_gbp = "20.00"

# The postal address a cash-by-post member is given. It is the operator's own, so
# it lives in openbsd/etc/kyriakon.env with the other host-specific values and
# scripts/deploy-onboard.sh substitutes it here from /root/.kyriakon-env. The
# placeholder below is refused rather than installed, and the terms page
# publishes the same address with the trader's identity at deploy time.
postal_address = "REPLACE_ME"

# The Maildir smtpd delivers apply@kyriakon.net to. Plaintext on purpose: the
# drain reads the key to file it, which is why this address is not on the
# encrypting LMTP path. scripts/onboard-store.sh makes the directory and its
# _onboard ownership.
mail_dir = "/var/db/onboard/mail/new"

# The deployed commit and date, substituted at install, e.g. "2026-10-10 1a2b3c4".
# The drain records it on a journal line so a transition can be traced to the
# release that carried it out, and it is the document version the confirmation
# email quotes. It is the release the box is running, not a hash of anything.
release = "REPLACE_ME"

# The platform's published DNS values, which every body's recipe is generated
# from. Public values, but the IPs and the DKIM key are placeholders here and are
# substituted at deploy from /root/.kyriakon-env and the tracked zone. The
# repository must not hold a second copy: a key restated here would keep
# publishing after a rotation, and nothing would fail. scripts/deploy-onboard.sh
# refuses a placeholder, and the drain's own recipe reader refuses one too.
#
# The MX names the platform's mail host rather than a name of the body's:
# the box's reverse record is set at the hosting provider against that host and
# cannot be varied per body. The selector is the one the DKIM filter signs with;
# rotating it is one filter change and one new record in every body's zone.
mail_host = "mail.kyriakon.net"
ipv4 = "REPLACE_ME_IPV4"
ipv6 = "REPLACE_ME_IPV6"
dkim_selector = "mail"
dkim_public_key = "REPLACE_ME"
dmarc_rua = "mailto:dmarc@kyriakon.net"

# The resolver the broken-DNS sweep runs, by path. `dig +short` is the shape the
# issue's own check uses and the zone's tooling assumes. A configuration value
# rather than a literal so the acceptance tests stub it and never touch the
# network: the drain can only observe a body's zone, never change it.
resolver = "/usr/bin/dig"
