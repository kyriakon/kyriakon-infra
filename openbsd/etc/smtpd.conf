# smtpd.conf — kyriakon.net mail server.
#
# On-box path: /etc/mail/smtpd.conf.
# Syntax-check on a real OpenBSD host (NOT CI): smtpd -n -f /etc/mail/smtpd.conf
#
# Deliverability posture: DKIM-sign outbound, encrypt the queue spool, and
# deliver local mail to Dovecot over LMTP (where the kyriakon-encrypt plugin
# encrypts on the save path — see dovecot.conf). spamd greylisting is enabled
# at the pf layer (divert-to), not here: see the propose-only fragment in the
# PR body.

# --- Declarations -------------------------------------------------------

# Domains we receive mail for.
table mail_domains { "kyriakon.net" }

# Aliases (postmaster, abuse, etc.) live in /etc/mail/aliases.
table aliases file:/etc/mail/aliases

# TLS certificate for mail.kyriakon.net (acme-client). Paths are OpenBSD
# defaults; the cert/key are issued on the box and never committed.
pki mail.kyriakon.net cert "/etc/ssl/mail.kyriakon.net.fullchain.pem"
pki mail.kyriakon.net key "/etc/ssl/private/mail.kyriakon.net.key"

# DKIM signing: selector "mail" matches the mail._domainkey record published
# in the zone file. The private key lives on the box at
# /etc/mail/dkim/private.rsa.key and is NEVER in this repo.
filter "dkimsign" proc-exec "filter-dkimsign -d kyriakon.net -s mail \
	-k /etc/mail/dkim/private.rsa.key" user _dkimsign group _dkimsign

# --- Listeners ----------------------------------------------------------

#   socket: local enqueuer (cron, sendmail(1)) — DKIM-signed.
#   lo0:    local loopback — DKIM-signed.
#   egress: public interfaces — inbound mail (STARTTLS, auth-optional so
#           unauthenticated delivery works) and submission (smtps, auth).
#   DKIM is applied ONLY to submission and local enqueue, never the inbound
#   listener: filter-dkimsign falls back to d=kyriakon.net for any From
#   domain it doesn't match, so inbound foreign mail would be stamped with a
#   bogus signature. Sign only what we originate.
listen on socket filter "dkimsign"
listen on lo0 filter "dkimsign"
listen on egress tls pki mail.kyriakon.net auth-optional
listen on egress smtps pki mail.kyriakon.net auth filter "dkimsign"

# --- Actions ------------------------------------------------------------

# Local delivery: hand the message to Dovecot over LMTP. The kyriakon-encrypt
# plugin encrypts it there (single encryption point — no smtpd-side PGP).
action "local_mail" lmtp "/var/dovecot/lmtp" rcpt-to alias <aliases>
action "relay" relay

# --- Routing (first match wins; no match is rejected — no open relay) ----

match from any for domain <mail_domains> action "local_mail"
match from local for local action "local_mail"
match auth from any for any action "relay"

# --- Queue --------------------------------------------------------------

# Encrypt the queue spool (AES-256-GCM). The key is a startup passphrase
# (getpass(3)) — platform-held, so this closes the transient plaintext window
# against a walked-away disk but is NOT zero-access. Recorded in threat-model.md.
queue encryption
