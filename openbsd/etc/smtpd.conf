# smtpd.conf — kyriakon.net mail server.
#
# On-box path: /etc/mail/smtpd.conf.
# Syntax-check on a real OpenBSD host (NOT CI): smtpd -n -f /etc/mail/smtpd.conf
#
# Deliverability posture: DKIM-sign outbound, encrypt the queue spool, and
# deliver local mail to Dovecot over LMTP (where the kyriakon-encrypt plugin
# encrypts on the save path, see dovecot.conf). Greylisting is switched on at the
# pf layer by a divert-to rule and is not configured here, or in a spamd.conf,
# either: see docs/planning/research/spamd-greylisting.md.

# --- Declarations -------------------------------------------------------

# Domains we receive mail for. Generated on the box rather than listed here:
# deploy-mail.sh seeds it with the platform's own domain, and the drain appends
# each body's domain as it provisions it, so a second domain is a line in this
# file plus an smtpd reload rather than an edit to this tracked config.
table mail_domains file:/etc/mail/mail_domains

# Per-address delivery, keyed on the full address so two bodies can both hold
# secretary@. The platform's own aliases (root, postmaster, abuse, dmarc, admin,
# hello) live in this table as bare localparts, which the lookup still finds
# because it tries user@domain first and then user.
#
# This replaces the aliases file, and the two are alternatives rather than
# layers: smtpd refuses one dispatcher carrying both with "alias mapping already
# specified for this dispatcher". Adding an alias mapping back to the action
# below is the mistake that error describes, not a way to have both.
# /etc/mail/aliases is no longer read for local delivery.
table virtuals file:/etc/mail/virtuals

# Envelope senders each authenticated account may submit as: a mapping from
# account name to a comma-separated list of addresses, generated on the box by
# deploy-mail.sh (provision-member.sh adds an address to an account's list as it
# creates a member, and the drain's group transition does the same). An account
# owns its own login address and every full-address virtuals entry that delivers
# into it, which is how a group mailbox sends as the address it publishes. The
# `senders` option on both egress listeners holds a submission to the addresses
# mapped to the account that authenticated, so one member cannot name another's
# address. A bare alias and an address aimed at a service account are absent
# because no account owns them.
table mail_from file:/etc/mail/mail_from

# TLS certificate for mail.kyriakon.net (acme-client). Paths are OpenBSD
# defaults; the cert/key are issued on the box and never committed.
pki mail.kyriakon.net cert "/etc/ssl/mail.kyriakon.net.fullchain.pem"
pki mail.kyriakon.net key "/etc/ssl/private/mail.kyriakon.net.key"

# DKIM signing: selector "mail" matches the mail._domainkey record published in
# every signed domain's zone. The private key lives on the box at
# /etc/mail/dkim/private.rsa.key and is NEVER in this repo.
#
# One filter process and one key sign every domain the platform sends as. The -d
# list comes from /etc/mail/dkim_domains, one domain per line, which
# deploy-mail.sh expands into REPLACE_ME_DKIM_DOMAINS when it installs this file
# and the drain re-expands when a body joins or leaves. The filter signs with the
# domain that matches the message's From header and falls back to the FIRST -d,
# which is why the platform's own domain must stay first in that list and why
# every body's domain must be in it before the body sends: a domain the filter
# does not know is signed with the fallback, its d= then does not match its From
# domain, and DMARC alignment fails.
filter "dkimsign" proc-exec "filter-dkimsign REPLACE_ME_DKIM_DOMAINS -s mail \
	-k /etc/mail/dkim/private.rsa.key" user _dkimsign group _dkimsign

# From-header enforcement, ahead of the signer. `senders <mail_from>` binds the
# envelope sender and nothing else, and filter-dkimsign signs whichever domain
# the message's From header names, so without this one member could send
# DKIM-signed, DMARC-aligned mail as hello@kyriakon.net or as another body's
# secretary@. filter-fromcheck refuses at DATA a From the session may not use:
# the addresses mapped to the account when the session authenticated, and the
# domains named below when it came from the local enqueuer, which has no account
# to map. scripts/filter-fromcheck.sh is the policy, its reasoning and its tests.
filter "fromcheck" proc-exec "/usr/local/libexec/filter-fromcheck.sh \
	-t /etc/mail/mail_from -a kyriakon.net -a mail.kyriakon.net"

# The order is the whole property: refuse a From this session may not use, then
# sign what is left. A message the first filter rejects is never handed to the
# signer, so it cannot leave with the platform's key on another address's header.
filter "sign" chain { "fromcheck", "dkimsign" }

# --- Listeners ----------------------------------------------------------

#   socket: local enqueuer (cron, sendmail(1)) — From-checked and DKIM-signed.
#   egress: public interfaces — inbound mail (STARTTLS, auth-optional so
#           unauthenticated delivery works) and submission (smtps, auth).
#   DKIM is applied ONLY to submission and local enqueue, never the inbound
#   listener: filter-dkimsign falls back to d=kyriakon.net for any From
#   domain it doesn't match, so inbound foreign mail would be stamped with a
#   bogus signature. Sign only what we originate.
#
#   Both egress listeners carry `senders <mail_from>`, which only constrains
#   authenticated sessions: a member who authenticates on the auth-optional
#   port is held to their own addresses before `match auth` can relay, so that
#   listener is not a way around the submission check. It binds the envelope
#   sender, not the From header, and smtpd's `masquerade` is not an answer: the
#   header rewrite runs after the filter chain, so it would change the From the
#   signer had already covered. The header check therefore lives in
#   filter-fromcheck, which each of these listeners carries: the two signed
#   paths use the "sign" chain, and the auth-optional port carries "fromcheck"
#   alone because it never signs.
#
#   There is deliberately no listener on lo0. Every local submitter in this
#   tree (sendmail(1), cron(8), the drain's notices) enqueues through the
#   socket listener, and a TCP loopback listener would let any local process
#   relay DKIM-signed mail as any sender without authenticating.
listen on socket filter "sign"
listen on egress tls pki mail.kyriakon.net auth-optional filter "fromcheck" senders <mail_from>
listen on egress smtps pki mail.kyriakon.net auth filter "sign" senders <mail_from>

# --- Actions ------------------------------------------------------------

# Local delivery: hand the message to Dovecot over LMTP. The kyriakon-encrypt
# plugin encrypts it there (single encryption point — no smtpd-side PGP).
#
# No rcpt-to here, deliberately. That option makes the LMTP session use the
# recipient address instead of the local user, which breaks every address that
# expands twice over: Dovecot's userdb is asked about abuse@kyriakon.net, which
# is not an account, so LMTP answers 550 User does not exist and smtpd bounces
# it; and the encryptor resolves the recipient's key as <localpart>.asc, so it
# would look for abuse.asc, which does not exist either. Letting the virtual
# table resolve first means LMTP is asked about oliver, the account that
# actually has the keyring entry, and an alias into a body's mailbox resolves to
# its account the same way.
action "local_mail" lmtp "/var/dovecot/lmtp" virtual <virtuals>
# The onboarding key mailbox, deliberately not on the encrypting LMTP path: the
# drain has to read the key to file it against the application. A plaintext
# Maildir owned by _onboard, drained each pass, is the stated exception the
# capsule spec fixes. The match below must stay ahead of local_mail.
action "onboard_mail" maildir "/var/db/onboard/mail" user _onboard
# The delivery-status spool, plaintext for the same reason the onboarding one
# is. Every notice leaves the local enqueuer with `bounce@kyriakon.net` as its
# envelope sender, so a receiving host's permanent failure comes back here rather
# than to root's mailbox. The drain reads it each pass and marks the notice line
# with the failure; the parser ignores anything that is not a permanent-failure
# DSN. Deliberately NOT the encrypting LMTP path: the report is machine-read, and
# its recipient's mailbox may be the thing that failed. The route must stay
# ahead of `local_mail`, or the service address would be looked up as a mailbox.
action "bounce_mail" maildir "/var/db/onboard/bounce" user _onboard
action "relay" relay

# --- Routing (first match wins; no match is rejected — no open relay) ----

match from any for domain <mail_domains> rcpt-to apply@kyriakon.net action "onboard_mail"
# The envelope sender's own route. A DSN has an empty envelope sender and
# `bounce@kyriakon.net` as its recipient; it must not fall through to local_mail.
match from any for domain <mail_domains> rcpt-to bounce@kyriakon.net action "bounce_mail"
match from any for domain <mail_domains> action "local_mail"
match from local for local action "local_mail"
# Off-box mail from the enqueuer. Cron's own failure copy and every operator
# alert leave through sendmail(1) to ALERT_EMAIL, which check-hygiene.sh keeps
# off-box, and without this rule they are refused at RCPT: the alert path
# disappears while the box still reads as monitored. It has to follow the local
# deliveries, or a local recipient would be relayed instead of delivered.
match from local for any action "relay"
# Authenticated submission. The envelope sender is checked at MAIL FROM
# against <mail_from> by the listener's senders option, and the From header
# against the same mapping by "fromcheck" before the signer sees the message, so
# this rule only names where an authenticated transaction goes: an account absent
# from the table, or naming an address mapped to another account, is refused
# before it matches, and one writing somebody else's address in From is refused
# at DATA.
match auth from any for any action "relay"

# --- Queue --------------------------------------------------------------

# Encrypt the queue spool (AES-256-GCM). Two constraints from smtpd's source:
# the key is a STRING token (`QUEUE ENCRYPTION STRING` in
# usr.sbin/smtpd/parse.y), so it has to be quoted, and crypto_setup() takes it
# verbatim as raw bytes and rejects anything that is not exactly KEY_SIZE (32)
# characters, which is why the source suggests `openssl rand -hex 16`.
# Deploy-mail.sh persists that key in /etc/mail/queue.key, substitutes it
# below, and installs the result 0600 root because it carries the key. Left
# empty, smtpd instead reads a key with getpass(3) at startup, which cannot
# work at boot because rc.d has no terminal. Platform-held either way, so this
# closes the transient plaintext window against a walked-away disk but is NOT
# zero-access. Recorded in threat-model.md.
queue encryption "REPLACE_ME_QUEUE_KEY"
