# gmid.conf - the Gemini server. On-box path: /etc/gmid.conf
#
# Mirrors openbsd/etc/httpd.conf, which serves the same content trees over HTTPS:
# one directory per site under /home/www, a chroot to /home/www so the roots
# below are relative to it, and the same acme-client certificate. No second
# certificate is issued because a certificate is valid on whichever port
# presents it, which is what the proposal specifies (section 5.2).
#
# gmid.conf(5) says "All the paths in the configuration file are relative to the
# chroot directory, except for the cert, key and ocsp paths", so the root lines
# below are relative to /home/www and the cert and key lines stay absolute.
#
# Gemini does TLS with trust on first use rather than through a CA, so this
# certificate encrypts rather than proving identity to a stranger. Clients warn
# once and then remember it; there is nothing here for acme to do beyond what it
# already does for httpd.
#
# Per-member capsules arrive the way per-member vhosts do: one generated file per
# member under /etc/gmid.d, listed by the generated index included below. gmid
# cannot include a directory either (include takes one path and opens it with
# fopen), so a member file is written first and the index that lists it is
# rewritten after. A generated member file looks like this, with the member's
# site and capsule under one root:
#
#   server "alice.kyriakon.net" {
#       listen on * port 1965
#       cert "/etc/ssl/alice.kyriakon.net.fullchain.pem"
#       key "/etc/ssl/private/alice.kyriakon.net.key"
#       root "/alice.kyriakon.net/gemini"
#       location "/.git/*" {
#           block
#       }
#   }
#
# Deliberately minimal. gmid already defaults to serving index.gmi as the index,
# to three prefork workers, and to TLS only, so none of those are spelled out.
# Uncommented options are the ones this deployment has to differ on or make
# explicit.

# Drops to _gmid for its workers, the way httpd drops to www. Both the site
# directories and the certificate's public half are world-readable; the private
# key is root-only and is read before the drop.
user "_gmid"
chroot "/home/www"

include "/etc/gmid.d/index.conf"

# The landing site, over Gemini. Same content tree httpd serves from
# /home/www/kyriakon.net/www; the capsule half is /home/www/kyriakon.net/gemini,
# which is a checkout of kyriakon-site too, so index.gmi cannot drift from
# index.html the way a second copy would. The certificate is the one acme
# already renews for the vhost.
#
# The splash carries its Kleio and Press links as absolute URLs,
# gemini://kleio.kyriakon.net/ and gemini://press.kyriakon.net/, because Gemini
# has no paths to redirect: a capsule moves a reader to another capsule by naming
# it. Those links are content in that checkout, not settings here.
#
# .git is blocked for the same reason as below: this document root is a checkout,
# so without the block the capsule would serve the entire history, including
# anything deleted from the working tree.
server "kyriakon.net" {
	listen on * port 1965

	cert "/etc/ssl/kyriakon.net.fullchain.pem"
	key "/etc/ssl/private/kyriakon.net.key"

	root "/kyriakon.net/gemini"

	location "/.git/*" {
		block
	}
}

server "oliver.kyriakon.net" {
	# Spelled out rather than left to the default, so the port this opens is
	# visible here alongside the firewall rule that has to allow it.
	listen on * port 1965

	cert "/etc/ssl/oliver.kyriakon.net.fullchain.pem"
	key "/etc/ssl/private/oliver.kyriakon.net.key"

	root "/oliver.kyriakon.net/gemini"

	# This document root is a git checkout, the same as the landing site, so .git
	# is present and holds the entire history, including files deleted from the
	# working tree. httpd blocks this path and Gemini has to as well, or the
	# convention that a capsule is frozen published writing leaks the history
	# behind it.
	location "/.git/*" {
		block
	}
}

# The two project capsules. Each reuses the apex certificate file rather than
# getting one of its own, for the same reason its https vhost does: the name is
# already an alternative name on that certificate, and a second certificate would
# cost an issuance for no gain. httpd serves the same project from
# /home/www/<host>/www.
#
# No .git block here: these roots are the site's build output rather than a
# checkout, so there is no history in them to leak.
server "kleio.kyriakon.net" {
	listen on * port 1965

	cert "/etc/ssl/kyriakon.net.fullchain.pem"
	key "/etc/ssl/private/kyriakon.net.key"

	root "/kleio.kyriakon.net/gemini"
}

server "press.kyriakon.net" {
	listen on * port 1965

	cert "/etc/ssl/kyriakon.net.fullchain.pem"
	key "/etc/ssl/private/kyriakon.net.key"

	root "/press.kyriakon.net/gemini"
}
