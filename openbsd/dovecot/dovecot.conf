# dovecot.conf — kyriakon.net zero-access mail store.
#
# On-box path: /etc/dovecot/dovecot.conf (OpenBSD package default).
# Syntax-check on a real OpenBSD host (NOT CI): doveconf -n
#
# Auth is BSD authentication (bsdauth) against real system accounts, created by
# scripts/add-user.sh with shell /sbin/nologin. OpenBSD has no PAM and its
# dovecot package is built --without-pam, so driver = bsdauth is the only
# system-auth path; it calls auth_userokay(3), which consults passwd, not the
# shell field, so nologin blocks interactive logins without affecting mail.
# Storage is Maildir under each user's home, and the kyriakon-encrypt plugin
# encrypts every saved message on the save path (LMTP delivery and APPEND).

# IMAP for retrieval; LMTP for delivery from smtpd.
protocols = imap lmtp

# Maildir under each user's home directory.
mail_location = maildir:~/Maildir

# Delivered mail reaches LMTP as the bare local user, because the local_mail
# action in smtpd.conf lets aliases resolve before delivery rather than passing
# the recipient address through. %Ln is kept as a normalisation so that a
# client authenticating with a full address (oliver@kyriakon.net) still finds
# the account named oliver, instead of a userdb lookup that cannot match a
# system account name.
auth_username_format = %Ln

# bsdauth against system accounts; passdb userdb supplies uid/gid/home. The
# driver takes no arguments: it uses the default BSD auth style and passes
# "auth-<service>" as the type.
passdb {
  driver = bsdauth
}
userdb {
  driver = passwd
}

# LMTP socket smtpd delivers to (matches smtpd.conf action "local_mail",
# which connects to /var/dovecot/lmtp). Named "lmtp" rather than the absolute
# path: Dovecot's default lmtp service already declares a listener by that name
# and resolves it against base_dir (/var/dovecot), so declaring the same name
# overrides its settings. Writing the absolute path instead creates a second
# listener for the same socket, which master-settings.c rejects with
# "duplicate listener" and refuses to start.
#
# root:wheel 0600, rather than Dovecot's 0666 default. smtpd's mda is
# privileged when it connects here, so 0600 should be enough; the encryptor
# socket next door had to be loosened to 0666 because the mail save path runs as
# the mailbox user, and the LMTP listener is not on that path. A wrong mode here
# breaks every local delivery, so the deploy prints it and the runbook's last
# step is to watch one delivery for "Permission denied" before trusting it.
service lmtp {
  unix_listener lmtp {
    user = root
    group = wheel
    mode = 0600
  }
}

# Zero-access encryption: every saved message (delivery AND APPEND) goes
# through the kyriakon-encrypt plugin, which pipes plaintext to the
# kyriakon-encrypt daemon over /var/run/kyriakon/encrypt.sock and stores the
# RFC 3156 ciphertext. Fail-closed: a missing key or daemon aborts the save.
# See dovecot-plugin/ and kyriakon-encrypt/.
mail_plugins = $mail_plugins kyriakon_encrypt

# Plus-addressing: user+tag@kyriakon.net. The encryptor resolves the base
# localpart (strips +tag) for key lookup.
recipient_delimiter = +

# TLS for IMAP (acme-client cert for mail.kyriakon.net).
ssl = required
ssl_cert = </etc/ssl/mail.kyriakon.net.fullchain.pem
ssl_key = </etc/ssl/private/mail.kyriakon.net.key
