# The checks this repository already has, run on every pull request.
#
# Only what a runner can check honestly is here, and what stays manual does so
# without that being an oversight:
#
#   * The OpenBSD config syntax checks (httpd -n, smtpd -n, gmid -n, relayd -n)
#     need a real host, which the repository's own conventions already say.
#   * No `ksh -n` pass over scripts/: a parse under any shell but the box's
#     pdksh says nothing about it. The self-tests job is the exception that
#     carries its own shell: it installs oksh, the portable OpenBSD ksh, and
#     runs the scripts under it. CONTEXT.md records the trap, from a script
#     that passed its self-test on a workstation and died on the box's
#     `typeset -a`.
#
#
# What these catch, all of them found by hand in the 2026-10-15 audit: a status
# read inside the wrong branch, a loop variable read after its loop, a checkbox
# flag computed for one kind while the template draws two, and a route table
# drifting from the links the code emits.

name: checks

on:
  push:
    branches: [main]
  pull_request:

# Every job here compiles or runs pull-request-controlled code, so the default
# token gets read access and nothing more; a job that needs to push overrides it.
# No job pushes, and no checkout persists the token into .git/config where the
# code under test could read it.
permissions:
  contents: read

jobs:
  control:
    name: control crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The runner's own stable Rust rather than a toolchain action: the bar is
      # that the crate builds and its tests pass, and the versions are printed
      # so a failure is diagnosable without a second run.
      - name: toolchain
        run: rustc --version && cargo --version
      # Hand formatted until now; this is what stops the next drift arriving as a
      # 700-line commit nobody can review.
      - name: fmt
        run: cargo fmt --manifest-path control/Cargo.toml --all --check
      # The acceptance suite runs the installed binaries by path. `cargo test`
      # builds its own targets, not the plain binaries, so build them first.
      - name: build binaries
        run: cargo build --manifest-path control/Cargo.toml --workspace
      - name: test
        run: cargo test --manifest-path control/Cargo.toml
      # Warnings are errors: the crate is clean at this bar today, so a new one
      # fails the check rather than scrolling past.
      - name: clippy
        run: cargo clippy --manifest-path control/Cargo.toml --all-targets -- -D warnings
      # The package cut is a rule, not a convention: the unprivileged handler
      # must not link the root drain, and the terminal must not link the handler.
      # The tree is captured before it is searched: piped into grep under `bash
      # -e` without pipefail, a failed `cargo tree` would look like "no match"
      # and pass the check.
      - name: package boundary
        run: |
          set -eu
          boundary() {
            tree=$(cargo tree --manifest-path control/Cargo.toml -p "$1" --edges normal) || return 1
            case "$tree" in
            *"$2"*)
              printf 'package boundary crossed: %s depends on %s\n' "$1" "$2" >&2
              return 1
              ;;
            esac
          }
          boundary kyriakon-control-handler kyriakon-control-drain
          boundary kyriakon-control-tui kyriakon-control-handler
      # The handler links the prototype crate's check, so its fixtures, format
      # and lint run here; no other job in this file sees that crate.
      - name: key check fixtures
        run: cargo test --manifest-path docs/planning/prototypes/keygen-spike/Cargo.toml
      - name: key check fmt
        run: cargo fmt --manifest-path docs/planning/prototypes/keygen-spike/Cargo.toml --check
      - name: key check clippy
        run: cargo clippy --manifest-path docs/planning/prototypes/keygen-spike/Cargo.toml --all-targets -- -D warnings

  # The other crate in the tree, and the one the mail path depends on: the
  # encrypting LMTP the keyring is published for. It had tests before this file
  # did and nothing ran them. Its integration test drives `gpg` with a homedir of
  # its own, which the runner image carries.
  encrypt:
    name: encrypt plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: toolchain
        run: rustc --version && cargo --version
      # Hand formatted until now; this is what stops the next drift arriving as a
      # 700-line commit nobody can review.
      - name: fmt
        run: cargo fmt --manifest-path kyriakon-encrypt/Cargo.toml --check
      - name: test
        run: cargo test --manifest-path kyriakon-encrypt/Cargo.toml
      - name: clippy
        run: cargo clippy --manifest-path kyriakon-encrypt/Cargo.toml --all-targets -- -D warnings
      # The plugin itself needs the dovecot headers, which this runner does not
      # carry. The process glue needs only libc, and it is the part that must
      # turn a failed or truncated encryption into a failed save, so it is
      # built and run here rather than left to a review.
      - name: process glue
        run: make -C dovecot-plugin test

  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Every script in the tree, not only scripts/: the restore template's
      # prepare-disk.sh is tracked here too. It runs on the rescue host rather
      # than on this box and it is bash, which is why it is not in the ksh
      # half of this repository's conventions, but it is still a script nobody
      # reads before it is run.
      - name: shellcheck
        # NUL-separated, so a path holding a space stays one argument. The hooks
        # and the three ksh programs have no .sh suffix, so their paths are
        # named: nothing else lints them, and a quoting mistake in a hook fires
        # on every commit in every clone.
        run: |
          git ls-files -z '*.sh' \
            .githooks/commit-msg .githooks/pre-commit .githooks/pre-push \
            openbsd/etc/kyriakon-finger \
            openbsd/etc/rc.d/kyriakon_control \
            openbsd/etc/rc.d/kyriakon_onboard_sshd |
            xargs -0 shellcheck
      # A path with a space has to reach shellcheck as one argument. A
      # word-split list lints two names that do not exist and never reads this
      # file, which is what #746 was.
      - name: shellcheck a spaced path
        run: |
          set -eu
          dir=$(mktemp -d)
          git -C "$dir" init -q
          printf '#!/bin/sh\necho $1\n' > "$dir/a b.sh"
          git -C "$dir" add -A
          if out=$(cd "$dir" && git ls-files -z '*.sh' | xargs -0 shellcheck 2>&1); then
            printf 'a broken script was not linted at all:\n%s\n' "$out" >&2
            exit 1
          fi
          case "$out" in
          *"a b.sh"*) ;;
          *)
            printf 'shellcheck did not see the spaced path:\n%s\n' "$out" >&2
            exit 1
            ;;
          esac
      # A tracked binary is a build artifact, not source: it is unreviewable and
      # platform-specific. The pre-commit hook refuses a new one; this catches a
      # commit made with --no-verify.
      - name: no tracked binaries
        # `file` is run to completion before its output is searched: in a
        # pipeline its failure (or xargs') would reach grep as an empty stream
        # and pass the step.
        run: |
          set -eu
          types=$(git ls-files -z | xargs -0 file) || {
            printf 'file(1) failed, so nothing was scanned\n' >&2
            exit 1
          }
          if printf '%s\n' "$types" | grep -E ': (ELF|Mach-O|PE32)'; then
            printf 'tracked build artifact: remove it and add its path to .gitignore\n' >&2
            exit 1
          fi
      # The deploy self-test is the one that scans the crate's source for the
      # drain's script invocations. It needs only a pdksh-family shell and
      # coreutils, not BSD stat, so it runs here rather than waiting behind the
      # OpenBSD VM job. Ubuntu has no oksh package; mksh is the same lineage and
      # this step checks the scan, not the shell's portability. The full suite
      # runs in the OpenBSD 7.9 VM below.
      - name: deploy source-scan self-test
        run: |
          sudo apt-get update
          sudo apt-get install -y mksh
          mksh scripts/deploy-control.sh --self-test

  # The scripts' own tests are the only automated check most of them have, and
  # they run weekly on the box: without this a break reaches main and stays until
  # Monday. They assert scripts written for OpenBSD's ksh and BSD userland:
  # Linux's GNU coreutils answers `stat -f` differently, and macOS was only ever
  # a proxy. This job boots a real OpenBSD 7.9 VM on the Ubuntu runner, so the
  # shell and tools under test are the ones the box runs.
  self-tests:
    name: script self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: self-tests on OpenBSD 7.9
        uses: vmactions/openbsd-vm@v1.4.9
        with:
          release: "7.9"
          run: |
            set -eu
            ksh scripts/install-packages.sh --ci
            ksh scripts/install-packages.sh --check
            ksh scripts/self-test-all.sh

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          # The action's wrapper rewrites terraform's output and its exit status,
          # which is the one thing a check has to be able to read. Nothing here
          # parses its output either way.
          terraform_wrapper: false
      - name: format
        run: terraform fmt -check -recursive
        working-directory: terraform
      # validate needs the provider schemas, so this initializes without a
      # backend. It reads no state and reaches nothing at Hetzner, and the
      # committed lock file now carries the checksums for this platform as well
      # as the one it was first written on.
      - name: init
        run: terraform init -backend=false -input=false
        working-directory: terraform
      - name: validate
        run: terraform validate
        working-directory: terraform
