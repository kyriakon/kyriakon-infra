# Merge a member's published key without an operator click.
#
# scripts/publish-mail-key.sh opens `publish-key/<localpart>` with the box's
# token when an approval publishes a key, and the operator merges it by hand
# today. A key is not code: the checks run on it like any PR and pass, and the
# only decision is whether the published set should carry the key, which the
# approval already made. So the merge waits for the checks and then happens.
#
# Two repository settings this depends on, both off in a new repository:
#   allow_auto_merge                    -- "Allow auto-merge"
#   can_approve_pull_request_reviews    -- "Allow GitHub Actions to create and
#                                          approve pull requests"
# The first lets the merge be queued; the second is what lets the workflow's own
# token record the review the ruleset wants. A run with the second off says so
# and merges nothing, rather than going red.
#
# main's ruleset requires one approving review. Listing the machine account in its
# bypass list did not make the merge pass (`the base branch policy prohibits the
# merge`), so the workflow supplies the review itself: it approves under its own
# identity, github-actions[bot], and merges as the machine account. The review that
# matters is the operator's approval of the application, which is what published
# the key; this records that the checks passed on the result.
#
# It runs on the checks workflow's completion, not on the pull request, because a
# pull_request trigger would start beside the checks rather than after them.
# Two guards keep it narrow: the head branch must be a publish-key branch, and
# the diff must touch nothing outside keys/.
name: auto-merge key publications

on:
  workflow_run:
    workflows: [checks]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: merge the green publish-key pull request
        env:
          # A token of the machine account, not GITHUB_TOKEN: the merge is then
          # attributable to the credential that pushed the branch, which is the
          # account the author guard checked.
          GH_TOKEN: ${{ secrets.KEY_PUBLISHER_TOKEN }}
          # The workflow's own token, used only for the approval. Named apart so
          # the merge below cannot accidentally run as the bot.
          WORKFLOW_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          KEY_PUBLISHER_LOGIN: ${{ vars.KEY_PUBLISHER_LOGIN }}
        run: |
          set -eu
          # Fail closed if the credential is missing: without it the merge would
          # be attempted as the bot and refused by the review rule, which reads
          # as a broken workflow rather than an unconfigured one.
          if [ -z "${GH_TOKEN:-}" ]; then
            printf 'no KEY_PUBLISHER_TOKEN secret is set, so nothing is merged automatically\n'
            exit 0
          fi
          # Same repository only. workflow_run fires for a fork's pull request
          # too, with write permissions, and headRefName is only a branch name:
          # `publish-key/evil` in someone else's fork would otherwise match.
          # gh's --jq does not take jq's --arg, so the commit is checked as hex
          # and interpolated into the expression.
          case "$HEAD_SHA" in
          *[!0-9a-f]* | "")
            printf 'the commit is not a sha: %s\n' "$HEAD_SHA" >&2
            exit 1
            ;;
          esac
          # Only the box's own publications. The token that publish-mail-key.sh
          # pushes with belongs to one account; a branch someone else pushed is a
          # key a person has to look at, or a collaborator with write access has
          # found a way around the review it would otherwise get. Unset means
          # nothing auto-merges, which is the safe way to be wrong.
          if [ -z "${KEY_PUBLISHER_LOGIN:-}" ]; then
            printf 'no KEY_PUBLISHER_LOGIN variable is set, so nothing is merged automatically\n'
            exit 0
          fi
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,headRefName,headRefOid,isCrossRepository,author \
            --jq "[.[] | select(.headRefOid == \"$HEAD_SHA\" and .isCrossRepository == false and .author.login == \"$KEY_PUBLISHER_LOGIN\" and (.headRefName | startswith(\"publish-key/\")))] | .[0].number // empty")
          if [ -z "$pr" ]; then
            printf 'nothing to do: no open publish-key pull request of this repository at %s\n' "$HEAD_SHA"
            exit 0
          fi
          # Every changed file must be an *added* key. A modified or deleted one
          # would be a substitution: swapping a published key for another sends
          # that member's mail to whoever holds the new one, which is the one
          # thing the published set exists to prevent.
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr/files" --paginate \
            --jq '.[] | "\(.status) \(.filename)"')
          bad=$(printf '%s\n' "$files" | grep -vE '^added keys/[^/]+\.asc$' || true)
          if [ -n "$bad" ]; then
            printf 'leaving #%s alone: these are not new key files:\n%s\n' "$pr" "$bad"
            exit 0
          fi
          if [ -z "$files" ]; then
            printf 'leaving #%s alone: it changes no file\n' "$pr"
            exit 0
          fi
          # The token has to be the machine account's for the merge to be
          # attributable to the credential that pushed the branch, and the author
          # guard above only checked the pull request, not the token.
          who=$(gh api user --jq .login)
          printf 'acting as %s\n' "$who"
          if [ "$who" != "$KEY_PUBLISHER_LOGIN" ]; then
            printf 'the token belongs to %s, not %s, so nothing is merged\n' "$who" "$KEY_PUBLISHER_LOGIN"
            exit 0
          fi
          # The repository refuses this with a 403 until "Allow GitHub Actions to
          # create and approve pull requests" is on, which is off by default. A
          # refusal there is configuration, not a broken key, so it is named and
          # left for a person rather than reported as a failed run.
          if ! GH_TOKEN="$WORKFLOW_TOKEN" gh pr review "$pr" --repo "$GITHUB_REPOSITORY" \
            --approve --body "The approval published this key and the checks passed on it."; then
            printf 'the workflow could not approve #%s: check that the repository allows\n' "$pr"
            printf 'GitHub Actions to approve pull requests; nothing was merged\n'
            exit 0
          fi
          # --auto, because the approval takes a moment to count and the merge
          # would otherwise race it. It exits 0 once the merge is queued, so the
          # message says queued, not merged: the merge itself is the workflow run
          # on the pull request and the commit on main.
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --auto --delete-branch
          printf 'queued #%s to merge when the review registers\n' "$pr"
